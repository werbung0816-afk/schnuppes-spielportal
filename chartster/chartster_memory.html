<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chartster Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#53f6ff;--pink:#ff4fd8;--purple:#8f5fff;
  --bg:#07000f;--glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.10);
  --text:rgba(240,240,255,1);--muted:rgba(240,240,255,.45);
}
*{box-sizing:border-box;margin:0;padding:0;cursor:default!important;-webkit-tap-highlight-color:transparent}
input,label,button,select{cursor:pointer!important}

body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 15% 40%,rgba(143,95,255,.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(83,246,255,.12) 0%,transparent 60%),
    radial-gradient(ellipse 45% 45% at 65% 85%,rgba(255,79,216,.12) 0%,transparent 60%);
  min-height:100vh;color:var(--text);
}

.screen{display:none;min-height:100vh;padding:16px;align-items:center;justify-content:center;flex-direction:column}
.screen.active{display:flex}
.card{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:24px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.sep{width:100%;height:1px;background:var(--glass-b)}
.game-title{font-size:44px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(83,246,255,.4))}
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn{width:100%;padding:16px;border-radius:14px;font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;transition:all .2s;border:none;outline:none;-webkit-appearance:none;touch-action:manipulation;user-select:none}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4);box-shadow:0 0 20px rgba(83,246,255,.12)}
.btn-primary:active{box-shadow:0 0 32px rgba(83,246,255,.4)}
.btn-secondary{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--glass-b)}

.flt{padding:6px 10px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;transition:all .2s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.flt img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.flt.on{border-color:var(--purple);color:var(--purple);background:rgba(143,95,255,.12)}
.flt.off{opacity:.3;pointer-events:none}
.filter-wrap{display:flex;flex-wrap:wrap;gap:8px}

#hint-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,79,216,.18);border:1px solid rgba(255,79,216,.4);color:var(--pink);padding:11px 20px;border-radius:12px;font-size:16px;font-weight:600;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;white-space:nowrap;max-width:90vw}
#hint-toast.show{opacity:1}

#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:700;overflow:hidden}
@keyframes cf-fall{0%{opacity:1;transform:translateY(-20px) rotate(0deg)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}

/* ── LOBBY ── */
#screen-lobby{justify-content:flex-start;padding-top:32px}
.setup-section{width:100%;display:flex;flex-direction:column;gap:8px}

.player-rows{display:flex;flex-direction:column;gap:8px;width:100%}
.player-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);border-radius:12px;padding:10px 14px;transition:border-color .2s}
.player-row:focus-within{border-color:var(--purple);box-shadow:0 0 0 2px rgba(143,95,255,.15)}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.player-row input{background:transparent;border:none;outline:none;color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;width:100%}
.player-row input::placeholder{color:var(--muted)}

.pair-sel{display:flex;gap:8px;width:100%}
.pair-btn{flex:1;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:14px 8px;font-family:'Outfit',sans-serif;color:var(--muted);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
.pair-btn .pn{font-size:28px;font-weight:900;line-height:1}
.pair-btn .pl{font-size:10px;letter-spacing:.04em}
.pair-btn.on{border-color:var(--pink);color:var(--pink);background:rgba(255,79,216,.08)}

#flt-info{font-size:12px;color:var(--muted);min-height:18px}
#flt-info.warn{color:var(--pink)}

/* ── SEAT SELECTOR ── */
#table-selector{width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.ts-top-row,.ts-bot-row{display:flex;gap:32px;justify-content:center;padding:8px 0}
.ts-mid-row{display:flex;align-items:center;justify-content:center;width:100%;padding:4px 0}
#ts-table-body{width:220px;height:104px;flex:none;margin:0 8px;display:flex;align-items:center;justify-content:center;color:transparent;background:url(./icons/table.png) center/contain no-repeat;position:relative;filter:drop-shadow(0 4px 24px rgba(143,95,255,.5))}
.ts-side{display:flex;align-items:center;justify-content:center;padding:4px 0;flex:1}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px;cursor:pointer!important}
.seat-inp{width:92px;background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:6px 8px;color:var(--text);font-family:'Outfit',sans-serif;font-size:12px;outline:none;display:none;text-align:center}
.seat.active .seat-inp{display:block}
.ts-side .seat-inp{width:72px}
.seat-circle{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(83,246,255,.3);display:flex;align-items:center;justify-content:center;transition:all .25s;background:rgba(83,246,255,.04);position:relative;overflow:hidden;color:rgba(83,246,255,.4);box-shadow:0 0 8px rgba(83,246,255,.08)}
.seat.active .seat-circle{border-style:solid;border-width:2.5px;color:#07000f}
.seat.active .seat-circle::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.18),transparent 70%)}

/* ── GAME SCREEN ── */
#screen-game{justify-content:flex-start;padding:12px 12px 24px;align-items:center}

.scoreboard{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px;margin-bottom:10px}
.s-chip{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-b);border-radius:40px;padding:7px 14px;font-size:14px;font-weight:600;transition:all .25s}
.s-chip.cur{border-width:2px;box-shadow:0 0 16px rgba(0,0,0,.5)}
.s-chip .sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.s-chip .spts{font-size:17px;font-weight:900;min-width:22px;text-align:center}

.turn-line{font-size:13px;color:var(--muted);height:20px;text-align:center;margin-bottom:8px}
.turn-line span{font-weight:700;color:var(--text)}

.mem-grid{display:grid;gap:8px;width:100%;max-width:900px}
.mem-grid.g6 {grid-template-columns:repeat(4,1fr)}
.mem-grid.g8 {grid-template-columns:repeat(4,1fr)}
.mem-grid.g10{grid-template-columns:repeat(5,1fr)}
.mem-grid.g12{grid-template-columns:repeat(6,1fr)}
@media(max-width:480px){
  .mem-grid.g12{grid-template-columns:repeat(4,1fr)}
  .mem-grid.g10{grid-template-columns:repeat(4,1fr)}
}

.mc{width:100%;aspect-ratio:1/1;perspective:600px;position:relative}
.mc-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.4,0,.2,1);border-radius:10px}
.mc.flipped .mc-inner,.mc.matched .mc-inner{transform:rotateY(180deg)}
.mc-face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}

.mc-back{background:linear-gradient(145deg,#0e0120,#07000f);border:1px solid var(--glass-b);display:flex;align-items:center;justify-content:center;}
.mc-back-pattern{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(143,95,255,.04) 5px,rgba(143,95,255,.04) 6px)}
.mc-back-icon{position:relative;z-index:1;width:54%;aspect-ratio:1;object-fit:contain;opacity:.55;border-radius:12px}

.mc-cover{transform:rotateY(180deg);background:#08001a;border:1px solid rgba(83,246,255,.25);}
.mc-cover img{width:100%;height:100%;object-fit:contain;display:block;background:#08001a}
.mc-cover-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,rgba(83,246,255,.08),rgba(143,95,255,.08))}

.mc-text{transform:rotateY(180deg);background:linear-gradient(145deg,#12002a,#07000f);border:1px solid rgba(255,79,216,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 6px;text-align:center;gap:3px;}
.mc-text .mt-title{font-size:15px;font-weight:700;color:var(--cyan);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.mc-text .mt-artist{font-size:15px;font-weight:700;color:var(--pink);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

.mc.matched .mc-cover,.mc.matched .mc-text{opacity:.38}
.mc-match-badge{position:absolute;inset:0;border-radius:10px;display:none;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,.25);z-index:5;pointer-events:none;transition:opacity .3s}
.mc.matched .mc-match-badge{display:flex;opacity:1}

@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}20%{transform:rotateY(180deg) translateX(-5px)}50%{transform:rotateY(180deg) translateX(5px)}80%{transform:rotateY(180deg) translateX(-3px)}}
.mc.wrong .mc-inner{animation:shake .38s ease}
@keyframes matchpop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}
.mc.justmatched .mc-inner{animation:matchpop .3s ease}

/* ── VICTORY ── */
#victoryOverlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);z-index:999;overflow:hidden;flex-direction:column;padding:24px}
#victoryOverlay.show{display:flex}
@keyframes zoomIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.vc-inner{animation:zoomIn .5s ease;display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:440px}
.vc-title{font-size:clamp(36px,9vw,64px);font-weight:900;text-align:center;line-height:1.1}
.vc-subtitle{font-size:16px;color:var(--muted);text-align:center}
.vc-scores{display:flex;flex-direction:column;gap:10px;width:100%}
.vc-row{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:13px 18px}
.vc-row.winner{border-color:gold;background:rgba(255,215,0,.07);box-shadow:0 0 24px rgba(255,215,0,.15)}
.vc-medal{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.vc-name{flex:1;font-size:16px;font-weight:700}
.vc-pts{font-size:22px;font-weight:900}
.vc-pts small{font-size:11px;font-weight:400;color:var(--muted)}
.vfinal-btn{padding:16px 40px;border:none;border-radius:14px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));font-family:'Outfit',sans-serif;margin-top:4px}

.version{position:fixed;bottom:12px;right:16px;font-size:14px;font-weight:700;color:rgba(255,255,255,.5);z-index:100;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px}

/* ── LOBBY BACKGROUND ── */
#lobby-bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;pointer-events:none;
  display:block;
  perspective:900px;
}
.lbg-slot{
  position:absolute;
  opacity:0;
  z-index:2;
  animation-name:lbg-emerge;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
.lbg-cover{
  width:100%;height:100%;
  background-size:cover;background-position:center;
  border-radius:10px;
  filter:brightness(.65) saturate(.75);
}
.lbg-note{
  position:absolute;
  line-height:1;
  user-select:none;
  opacity:0;
  z-index:1;
  animation-name:lbg-note-emerge;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
@keyframes lbg-emerge{
  0%,100%{opacity:0;transform:scale(.70);}
  22%,78%{opacity:.40;transform:scale(1.0);}
  50%    {opacity:.45;transform:scale(1.03);}
}
@keyframes lbg-note-emerge{
  0%,100%{opacity:0;transform:scale(.82);}
  25%,75%{opacity:.35;transform:scale(1.0);}
  50%    {opacity:.40;transform:scale(1.01);}
}

/* ── LOBBY DOTS ── */
.lbg-dot{
  position:absolute;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(1);
  opacity:0;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
@keyframes lbg-dot-pulse{
  0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
  40%,60%{opacity:.65;transform:translate(-50%,-50%) scale(1.4);}
  50%    {opacity:.65;transform:translate(-50%,-50%) scale(1);}
}
@keyframes lbg-dot-fade{
  0%,100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  35%,65%{opacity:.65;transform:translate(-50%,-50%) scale(1);}
}
/* ── LOBBY DOTS ── */
.lbg-dot{
  position:absolute;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(1);
  opacity:0;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}

</style>
</head>
<body>
<div id="lobby-bg"></div>

<div id="hint-toast"></div>
<div class="version">v1.1.1</div>
<div id="confetti"></div>
<div id="victoryOverlay"></div>

<!-- ════ LOBBY ════ -->
<div id="screen-lobby" class="screen active">
<div class="card" style="margin-top:16px;margin-bottom:24px">
  <div class="game-title" style="font-size:34px">🃏 Chartster Memory</div>
  <div class="sep"></div>

  <!-- Seat selector -->
  <div class="setup-section">
    <div class="label">Spieler wählen</div>
    <div id="table-selector">
      <div class="ts-top-row">
        <div class="seat" data-pos="top-l" onclick="toggleSeat('top-l')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
        <div class="seat" data-pos="top-r" onclick="toggleSeat('top-r')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
      </div>
      <div class="ts-mid-row">
        <div class="ts-side"><div class="seat" data-pos="left" onclick="toggleSeat('left')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()"></div></div>
        <div id="ts-table-body"></div>
        <div class="ts-side"><div class="seat" data-pos="right" onclick="toggleSeat('right')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()"></div></div>
      </div>
      <div class="ts-bot-row">
        <div class="seat" data-pos="bot-l" onclick="toggleSeat('bot-l')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
        <div class="seat" data-pos="bot-r" onclick="toggleSeat('bot-r')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
      </div>
    </div>
  </div>

  <!-- Pairs selector (standalone only) -->
  <div class="setup-section" id="pairs-section">
    <div class="label">Anzahl Paare</div>
    <div class="pair-sel">
      <button class="pair-btn" data-p="6" onclick="setPairs(this)"><span class="pn">6</span><span class="pl">Paare</span></button>
      <button class="pair-btn on" data-p="8" onclick="setPairs(this)"><span class="pn">8</span><span class="pl">Paare</span></button>
      <button class="pair-btn" data-p="10" onclick="setPairs(this)"><span class="pn">10</span><span class="pl">Paare</span></button>
      <button class="pair-btn" data-p="12" onclick="setPairs(this)"><span class="pn">12</span><span class="pl">Paare</span></button>
    </div>
  </div>

  <!-- Filter -->
  <div class="setup-section">
    <div class="label">Chartjahre</div>
    <div class="filter-wrap">
      <button class="flt" data-f="70" onclick="toggleFlt(this)"><img src="./filter/filter-70er.png" alt="70er">70er</button>
      <button class="flt" data-f="80" onclick="toggleFlt(this)"><img src="./filter/filter-80er.png" alt="80er">80er</button>
      <button class="flt" data-f="90" onclick="toggleFlt(this)"><img src="./filter/filter-90er.png" alt="90er">90er</button>
      <button class="flt" data-f="00" onclick="toggleFlt(this)"><img src="./filter/filter-00er.png" alt="00er">00er</button>
      <button class="flt" data-f="10" onclick="toggleFlt(this)"><img src="./filter/filter-10er.png" alt="10er">10er</button>
      <button class="flt" data-f="20" onclick="toggleFlt(this)"><img src="./filter/filter-20er.png" alt="20er">20er</button>
    </div>
    <div id="flt-info"></div>
  </div>

  <div class="sep"></div>
  <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>Spiel starten</button>
  <div id="lobby-status" style="font-size:13px;color:var(--muted);text-align:center"></div>
</div>
</div>

<!-- ════ GAME ════ -->
<div id="screen-game" class="screen">
  <div class="scoreboard" id="scoreboard"></div>
  <div class="turn-line" id="turn-line"></div>
  <div class="mem-grid" id="mem-grid"></div>
</div>

<script>
// ════ EMBEDDED MODE CHECK ════
var EMBEDDED_MODE = (new URLSearchParams(window.location.search)).get('embedded') === '1';
var embCfg = {};
if(EMBEDDED_MODE){
  try { embCfg = JSON.parse(sessionStorage.getItem('chartsterMiniConfig') || '{}'); } catch(e){}
}

const COLORS=['#53f6ff','#ff4fd8','#8f5fff','#4dff91','#ff9f1c','#e0ff4f'];
const DECADES=['70','80','90','00','10','20'];
var DEFAULTS=['Spieler 1','Spieler 2','Spieler 3','Spieler 4','Spieler 5','Spieler 6'];
var MAX_SEATS=6;
var SEAT_POS=['top-l','top-r','left','right','bot-l','bot-r'];
var seatCfg={'top-l':null,'top-r':null,'left':null,'right':null,'bot-l':null,'bot-r':null};

var G={
  songs:[],
  filters:new Set(),
  pairs:8,
  players:[],
  playerColors:[],
  playerOrigIdx:[],  // original Chartster team index
  scores:[],
  cur:0,
  cards:[],
  flipped:[],
  matched:new Set(),
  locked:false
};

// ════ SEAT LOGIC ════
function toggleSeat(pos){
  if(EMBEDDED_MODE) return;
  var seat=document.querySelector('.seat[data-pos="'+pos+'"]');
  if(seatCfg[pos]){
    seatCfg[pos]=null; seat.classList.remove('active');
    seat.querySelector('.seat-circle').style.cssText='';
    var inp=seat.querySelector('.seat-inp'); inp.value=''; inp.style.display='none';
    reassignSeatColors();
  } else {
    var active=getActiveSeats();
    if(active.length>=MAX_SEATS){showHint('Maximal '+MAX_SEATS+' Spieler!'); return;}
    var ci=active.length;
    seatCfg[pos]={name:'',colorIdx:ci};
    seat.classList.add('active');
    var circ=seat.querySelector('.seat-circle');
    circ.style.background=COLORS[ci]; circ.style.borderColor=COLORS[ci];
    circ.style.borderStyle='solid'; circ.textContent=DEFAULTS[ci].substring(0,2);
    var inp=seat.querySelector('.seat-inp');
    inp.style.display='block'; inp.placeholder=DEFAULTS[ci];
  }
  updateStartBtn();
}
function reassignSeatColors(){
  getActiveSeats().forEach(function(pos,i){
    var seat=document.querySelector('.seat[data-pos="'+pos+'"]');
    seatCfg[pos].colorIdx=i;
    var circ=seat.querySelector('.seat-circle');
    circ.style.background=COLORS[i]; circ.style.borderColor=COLORS[i];
    seat.querySelector('.seat-inp').placeholder=DEFAULTS[i];
  });
}
function getActiveSeats(){return SEAT_POS.filter(function(p){return seatCfg[p]!==null;});}
function updateStartBtn(){
  var ok=G.songs.length>0 && (EMBEDDED_MODE || getActiveSeats().length>=1);
  document.getElementById('start-btn').disabled=!ok;
}

// ════ BOOT ════
loadSongs();

// If embedded mode: apply filter from config and hide ui
if(EMBEDDED_MODE){
  document.getElementById('pairs-section').style.display='none';
  document.getElementById('table-selector').style.display='none';
  document.querySelector('[data-pos]') && (document.querySelector('.setup-section .label').textContent = '');
  // Apply filters from config
  if(embCfg.filters && embCfg.filters.length){
    embCfg.filters.forEach(function(f){
      var btn=document.querySelector('.flt[data-f="'+f+'"]');
      if(btn){btn.classList.add('on');G.filters.add(f);}
    });
  }
  if(embCfg.pairs) G.pairs=embCfg.pairs;
  document.getElementById('start-btn').textContent='Memory starten!';
}

function loadSongs(){
  document.getElementById('lobby-status').textContent='lädt …';
  fetch('./songs.json')
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(data=>{
      var all=Array.isArray(data)?data:(data.songs||[]);
      G.songs=all.filter(s=>s.c&&s.c.trim()!=='');
buildLobbyBg();
      document.getElementById('lobby-status').textContent='';
      updateStartBtn();
      updateFltInfo();
      if(EMBEDDED_MODE) startGame();
    })
    .catch(()=>{
      document.getElementById('lobby-status').textContent='⚠ songs.json nicht gefunden';
    });
}

// ════ FILTER LOGIC ════
function toggleFlt(btn){
  var f=btn.dataset.f;
  if(btn.classList.contains('on')){btn.classList.remove('on');G.filters.delete(f);}
  else{btn.classList.add('on');G.filters.add(f);}
  updateFltInfo();
}

function filteredSongs(){
  var s=G.songs.slice();
  if(G.filters.size===0) return s;
  var dec=DECADES.filter(d=>G.filters.has(d));
  if(dec.length){
    s=s.filter(x=>dec.some(d=>{
      if(d==='70')return x.y>=1970&&x.y<1980;
      if(d==='80')return x.y>=1980&&x.y<1990;
      if(d==='90')return x.y>=1990&&x.y<2000;
      if(d==='00')return x.y>=2000&&x.y<2010;
      if(d==='10')return x.y>=2010&&x.y<2020;
      if(d==='20')return x.y>=2020;
      return false;
    }));
  }
  if(G.filters.has('top10')) s=s.filter(x=>x.p<=10);
  else if(G.filters.has('top20')) s=s.filter(x=>x.p<=20);
  return s;
}

function updateFltInfo(){
  var n=filteredSongs().length;
  var el=document.getElementById('flt-info');
  var need=G.pairs;
  if(G.filters.size===0){el.textContent='';el.className='';}
  else if(n<need){el.textContent='⚠ Nur '+n+' Songs – mindestens '+need+' benötigt';el.className='warn';}
  else{el.textContent=n+' Songs verfügbar';el.className='';}
  updateStartBtn();
}

// ════ PAIR SELECTOR ════
function setPairs(btn){
  document.querySelectorAll('.pair-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  G.pairs=parseInt(btn.dataset.p);
  updateFltInfo();
}

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ════ START ════
function startGame(){
  if(EMBEDDED_MODE){
    // Players from config
    var ep=embCfg.players||[];
    G.players=ep.map(p=>p.name);
    G.playerColors=ep.map((p,i)=>p.color||COLORS[i]);
    G.playerOrigIdx=ep.map((p,i)=>p.origIdx!==undefined?p.origIdx:i);
    G.pairs=embCfg.pairs||8;
  } else {
    var active=getActiveSeats();
    if(active.length<1){showHint('Mindestens 1 Spieler!'); return;}
    G.players=active.map(function(pos,i){
      var inp=document.querySelector('.seat[data-pos="'+pos+'"] .seat-inp');
      return inp&&inp.value.trim()?inp.value.trim():DEFAULTS[i];
    });
    G.playerColors=G.players.map((_,i)=>COLORS[i]);
    G.playerOrigIdx=G.players.map((_,i)=>i);
  }

  var pool=filteredSongs();
  if(pool.length<G.pairs){
    showHint('Nicht genug Songs mit Cover für '+G.pairs+' Paare!');
    return;
  }

  G.scores=G.players.map(()=>0);
  G.cur=0;G.flipped=[];G.matched=new Set();G.locked=false;

  var chosen=shuffle(pool).slice(0,G.pairs);
  var cards=[];
  chosen.forEach(function(song,i){
    cards.push({type:'cover',song:song,pair:i});
    cards.push({type:'text', song:song,pair:i});
  });
  G.cards=shuffle(cards);

  renderScoreboard();
  renderGrid();
  updateTurnLine();
  showScreen('game');
}

// ════ SCOREBOARD ════
function renderScoreboard(){
  var sb=document.getElementById('scoreboard');
  sb.innerHTML='';
  G.players.forEach(function(name,i){
    var chip=document.createElement('div');
    chip.className='s-chip';chip.id='chip-'+i;
    chip.innerHTML=
      '<div class="sdot" style="background:'+G.playerColors[i]+';box-shadow:0 0 6px '+G.playerColors[i]+'"></div>'+
      '<span>'+esc(name)+'</span>'+
      '<span class="spts" id="pts-'+i+'" style="color:'+G.playerColors[i]+'">0</span>';
    sb.appendChild(chip);
  });
  highlightCur();
}
function updateScoreboard(){
  G.players.forEach(function(_,i){document.getElementById('pts-'+i).textContent=G.scores[i];});
  highlightCur();
}
function highlightCur(){
  G.players.forEach(function(_,i){
    var c=document.getElementById('chip-'+i);if(!c)return;
    c.classList.toggle('cur',i===G.cur);
    c.style.borderColor=i===G.cur?G.playerColors[i]:'';
    c.style.boxShadow=i===G.cur?'0 0 14px '+G.playerColors[i]+'55':'';
  });
}
function updateTurnLine(){
  var el=document.getElementById('turn-line');
  if(G.players.length<=1){el.innerHTML='';return;}
  el.innerHTML='Dran: <span style="color:'+G.playerColors[G.cur]+'">'+esc(G.players[G.cur])+'</span>';
}

// ════ GRID ════
function renderGrid(){
  var grid=document.getElementById('mem-grid');grid.innerHTML='';
  grid.className='mem-grid g'+G.pairs;
  G.cards.forEach(function(card,idx){
    var el=document.createElement('div');
    el.className='mc';el.dataset.idx=idx;
    el.ontouchstart=function(){flipCard(idx);};
    el.onclick=function(){flipCard(idx);};

    var front='';
    if(card.type==='cover'){
      front='<div class="mc-face mc-cover">'+
        '<img src="'+esc(card.song.c)+'" alt="" loading="lazy" '+
        'onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=mc-cover-fb>🎵</div>\'">'+
        '</div>';
    } else {
      front='<div class="mc-face mc-text">'+
        '<div class="mt-title">'+esc(card.song.t||'')+'</div>'+
        '<div class="mt-artist">'+esc(card.song.a||'')+'</div>'+
        '</div>';
    }

    el.innerHTML=
      '<div class="mc-inner">'+
        '<div class="mc-face mc-back">'+
          '<div class="mc-back-pattern"></div>'+
          '<img class="mc-back-icon" src="./icons/icon-192x192.png" alt="" onerror="this.style.display=\'none\'">'+
        '</div>'+
        front+
        '<div class="mc-match-badge">✓</div>'+
      '</div>';

    grid.appendChild(el);
  });
}

// ════ FLIP LOGIC ════
function flipCard(idx){
  if(G.locked)return;if(G.matched.has(idx))return;if(G.flipped.includes(idx))return;if(G.flipped.length>=2)return;
  document.getElementById('mem-grid').children[idx].classList.add('flipped');
  G.flipped.push(idx);
  if(G.flipped.length===2){G.locked=true;checkMatch();}
}

function checkMatch(){
  var a=G.flipped[0],b=G.flipped[1];
  var ca=G.cards[a],cb=G.cards[b];
  var els=document.getElementById('mem-grid').children;
  if(ca.pair===cb.pair && ca.type!==cb.type){
    setTimeout(function(){
      els[a].classList.remove('flipped');els[b].classList.remove('flipped');
      els[a].classList.add('matched','justmatched');els[b].classList.add('matched','justmatched');
      G.matched.add(a);G.matched.add(b);
      G.scores[G.cur]++;
      spawnConfetti(G.playerColors[G.cur],40);
      updateScoreboard();
      G.flipped=[];G.locked=false;
      setTimeout(function(){els[a].classList.remove('justmatched');els[b].classList.remove('justmatched');},350);
      if(G.matched.size===G.cards.length) setTimeout(showVictory,600);
    },420);
  } else {
    setTimeout(function(){
      els[a].classList.add('wrong');els[b].classList.add('wrong');
      setTimeout(function(){
        els[a].classList.remove('flipped','wrong');els[b].classList.remove('flipped','wrong');
        G.flipped=[];G.locked=false;
        G.cur=(G.cur+1)%G.players.length;
        updateTurnLine();updateScoreboard();
      },380);
    },700);
  }
}

// ════ VICTORY ════
function showVictory(){
  var ranked=G.players
    .map(function(name,i){return{name:name,score:G.scores[i],color:G.playerColors[i],origIdx:G.playerOrigIdx[i]};})
    .sort(function(a,b){return b.score-a.score;});

  var isTie=ranked.length>1&&ranked[0].score===ranked[1].score;
  var medals=['🥇','🥈','🥉','🏅','5.','6.'];

  var rows=ranked.map(function(p,i){
    var isWinner=i===0&&!isTie;
    return '<div class="vc-row'+(isWinner?' winner':'')+'">'+
      '<span class="vc-medal">'+medals[i]+'</span>'+
      '<span class="vc-name" style="color:'+p.color+'">'+esc(p.name)+'</span>'+
      '<span class="vc-pts" style="color:'+(isWinner?'gold':p.color)+'">'+
        p.score+'<small> Paar'+(p.score!==1?'e':'')+'</small>'+
      '</span>'+
    '</div>';
  }).join('');

  var title=isTie?'🤝 Unentschieden!':'🏆 '+esc(ranked[0].name)+' gewinnt!';
  var sub=isTie?'Beide mit '+ranked[0].score+' Paar'+(ranked[0].score!==1?'en':''):ranked[0].score+' Paar'+(ranked[0].score!==1?'e':'');

  var resetBtn=EMBEDDED_MODE?'':'<button class="vfinal-btn" onclick="resetToLobby()">🔄 Nochmal spielen</button>';

  document.getElementById('victoryOverlay').innerHTML=
    '<div class="vc-inner">'+
      '<div class="vc-title" style="background:linear-gradient(135deg,gold,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+title+'</div>'+
      '<div class="vc-subtitle">'+sub+'</div>'+
      '<div class="vc-scores">'+rows+'</div>'+
      resetBtn+
    '</div>';
  document.getElementById('victoryOverlay').classList.add('show');
  spawnConfetti(ranked[0].color,120);

  // Embedded: notify parent after brief delay
  if(EMBEDDED_MODE){
    var winner=isTie?null:ranked[0];
    setTimeout(function(){
      window.parent.postMessage({
        type:'miniGameResult',
        gameType:'memory',
        winnerOrigIdx: winner ? winner.origIdx : -1,
        winnerName: winner ? winner.name : null,
        winnerColor: winner ? winner.color : null,
        isTie: isTie
      },'*');
    },2000);
  }
}

function resetToLobby(){
  document.getElementById('victoryOverlay').classList.remove('show');
  updateFltInfo();
  showScreen('lobby');
}

// ════ CONFETTI ════
function spawnConfetti(color,count){
  var c=document.getElementById('confetti');
  var cols=[color,'#fff','#ffd84d',COLORS[Math.floor(Math.random()*COLORS.length)]];
  for(var i=0;i<count;i++){
    var p=document.createElement('div');var sz=5+Math.random()*12;var dur=1.2+Math.random()*1.8;
    p.style.cssText='position:absolute;top:-20px;left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';border-radius:'+['50%','3px','0'][i%3]+';transform:rotate('+Math.random()*360+'deg);animation:cf-fall '+dur+'s '+Math.random()*.6+'s linear both';
    c.appendChild(p);setTimeout(function(el){el.remove();},(dur+1)*1000,p);
  }
}

// ════ UTILS ════
function showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));var el=document.getElementById('screen-'+name);if(el)el.classList.add('active');}
function showHint(msg){var el=document.getElementById('hint-toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3000);}
function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function buildLobbyBg(){
  var bg=document.getElementById('lobby-bg');
  if(!bg) return;
  bg.innerHTML='';

  // 85% neueste + bestplatzierte Songs, 15% zufälliger Rest
  var withCover=G.songs.filter(function(s){return s.c;});
  var ranked=withCover.filter(function(s){return s.p&&s.p<=10&&s.y>=2005;})
    .sort(function(a,b){
      if(b.y!==a.y) return (b.y||0)-(a.y||0);
      return (a.p||99)-(b.p||99);
    });
  var unranked=shuffle(withCover.filter(function(s){return !s.p||s.p>20;}));
  // 85% beste/neueste (ranked, geordnet) + 15% zufälliger Rest
  var topPool = ranked.slice(0, Math.ceil(ranked.length));
  var restPool = shuffle(unranked);
  var pool = topPool.concat(restPool);
  var poolIdx=0;
  function nextCover(){var s=pool[poolIdx%pool.length];poolIdx++;return s;}

  // Fixed slot positions: manually defined grid avoiding center (30-70% x, 10-90% y)
  // Left column: 3 rows × 2 cols = 6 slots
  // Right column: 3 rows × 2 cols = 6 slots
  // Top strip: 3 slots across top
  // Bottom strip: 3 slots across bottom
  // Total: 18 cover slots
  function jit(v, range){ return +(v + (Math.random()-.5)*range).toFixed(1); }

  var coverSlots = [
    // Left col A (x≈8%)
    [jit(8,6),  jit(12,8)], [jit(8,6),  jit(42,8)], [jit(8,6),  jit(72,8)],
    // Left col B (x≈21%)
    [jit(21,6), jit(27,8)], [jit(21,6), jit(57,8)], [jit(21,6), jit(87,6)],
    // Right col A (x≈79%)
    [jit(79,6), jit(12,8)], [jit(79,6), jit(42,8)], [jit(79,6), jit(72,8)],
    // Right col B (x≈92%)
    [jit(92,5), jit(27,8)], [jit(92,5), jit(57,8)], [jit(92,5), jit(87,6)],
    // Top strip (y≈5%)
    [jit(35,6), jit(5,4)],  [jit(52,6), jit(5,4)],  [jit(66,5), jit(5,4)],
    // Bottom strip (y≈95%)
    [jit(35,6), jit(95,4)], [jit(52,6), jit(95,4)], [jit(66,5), jit(95,4)],
  ];
  coverSlots = shuffle(coverSlots);

  // Note slots: in gaps between cover slots
  var noteSlots = [
    [jit(5,4),  jit(32,6)], [jit(5,4),  jit(62,6)],
    [jit(19,5), jit(10,5)], [jit(19,5), jit(50,6)],
    [jit(81,5), jit(20,6)], [jit(81,5), jit(60,6)],
    [jit(95,4), jit(10,5)], [jit(95,4), jit(45,6)],
    [jit(42,6), jit(92,4)], [jit(60,6), jit(92,4)],
    [jit(42,6), jit(8,4)],  [jit(60,6), jit(8,4)],
  ];
  noteSlots = shuffle(noteSlots);

  coverSlots.forEach(function(pt){
    var depth=Math.random();
    var size=Math.round(75+depth*95);
    var blur=depth<0.3?(0.8-depth*1.5).toFixed(1)+'px':'0px';
    var rot=((Math.random()-.5)*22).toFixed(1);
    var fadeDur=Math.round(44+Math.random()*26);
    var fadeDelay=-Math.round(Math.random()*fadeDur);

    var slot=document.createElement('div');
    slot.className='lbg-slot';
    slot.style.width=size+'px'; slot.style.height=size+'px';
    slot.style.left=pt[0]+'%'; slot.style.top=pt[1]+'%';
    slot.style.transform='translate(-50%,-50%)';
    slot.style.animationDuration=fadeDur+'s';
    slot.style.animationDelay=fadeDelay+'s';

    var inner=document.createElement('div');
    inner.className='lbg-cover';
    inner.style.transform='rotate('+rot+'deg)';
    inner.style.backgroundImage='url("'+nextCover().c+'")';
    if(blur!=='0px') inner.style.filter='brightness(.65) saturate(.75) blur('+blur+')';
    slot.appendChild(inner);

    // On cycle: pick random slot from same approximate area
    slot.addEventListener('animationiteration',function(sl,inn,ox,oy){
      return function(){
        var nx=jit(ox,8), ny=jit(oy,10);
        nx=Math.max(2,Math.min(97,nx)); ny=Math.max(2,Math.min(97,ny));
        var d=Math.random(), sz=Math.round(75+d*95);
        var bl=d<0.3?(0.8-d*1.5).toFixed(1)+'px':'0px';
        sl.style.width=sz+'px'; sl.style.height=sz+'px';
        sl.style.left=nx.toFixed(1)+'%'; sl.style.top=ny.toFixed(1)+'%';
        inn.style.transform='rotate('+((Math.random()-.5)*22).toFixed(1)+'deg)';
        inn.style.backgroundImage='url("'+nextCover().c+'")';
        inn.style.filter=bl!=='0px'?'brightness(.65) saturate(.75) blur('+bl+')':'brightness(.65) saturate(.75)';
      };
    }(slot,inner,pt[0],pt[1]));
    bg.appendChild(slot);
  });

  var noteChars=['♩','♪','♫','♬','♭','♮','♩','♪','♫','♬','♭','♪'];
  var noteColors=['rgba(255,255,255,.40)','rgba(255,255,255,.40)','rgba(255,255,255,.40)','rgba(255,79,216,.30)','rgba(255,79,216,.30)','rgba(255,255,255,.40)'];
  noteSlots.forEach(function(pt,i){
    var sz=Math.round(32+Math.random()*38);
    var dur=Math.round(52+Math.random()*36);
    var delay=-Math.round(Math.random()*dur);
    var slot=document.createElement('div');
    slot.className='lbg-note';
    slot.style.fontSize=sz+'px';
    slot.style.left=pt[0]+'%'; slot.style.top=pt[1]+'%';
    slot.style.transform='translate(-50%,-50%)';
    slot.style.color=noteColors[i%noteColors.length];
    slot.style.animationDuration=dur+'s';
    slot.style.animationDelay=delay+'s';
    slot.textContent=noteChars[i%noteChars.length];
    slot.addEventListener('animationiteration',function(sl,ox,oy){
      return function(){
        var nx=jit(ox,8), ny=jit(oy,10);
        nx=Math.max(2,Math.min(97,nx)); ny=Math.max(2,Math.min(97,ny));
        sl.style.left=nx.toFixed(1)+'%'; sl.style.top=ny.toFixed(1)+'%';
        sl.style.fontSize=Math.round(32+Math.random()*38)+'px';
      };
    }(slot,pt[0],pt[1]));
    bg.appendChild(slot);
  });

  // Dots: 42 pulsing/fading particles
  var dotColors=[
    'rgba(83,246,255,1)','rgba(83,246,255,1)','rgba(83,246,255,1)',
    'rgba(255,79,216,1)','rgba(255,79,216,1)',
    'rgba(143,95,255,1)',
    'rgba(255,255,255,1)','rgba(255,255,255,1)',
  ];
  for(var d=0;d<42;d++){
    var dot=document.createElement('div');
    dot.className='lbg-dot';
    var sz=+(1.5+Math.random()*5).toFixed(1);
    var col=dotColors[Math.floor(Math.random()*dotColors.length)];
    var isPulse=Math.random()>.45;
    var dur=+(6+Math.random()*14).toFixed(1);
    var delay=-(Math.random()*dur).toFixed(1);
    var glow=sz>4?'0 0 '+(sz*3)+'px '+col:'none';
    dot.style.width=sz+'px'; dot.style.height=sz+'px';
    dot.style.left=(2+Math.random()*96).toFixed(1)+'%';
    dot.style.top=(2+Math.random()*96).toFixed(1)+'%';
    dot.style.background=col;
    dot.style.boxShadow=glow;
    dot.style.zIndex='0';
    dot.style.animationName=isPulse?'lbg-dot-pulse':'lbg-dot-fade';
    dot.style.animationDuration=dur+'s';
    dot.style.animationDelay=delay+'s';
    bg.appendChild(dot);
  }
}

</script>
</body>
