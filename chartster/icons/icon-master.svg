<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0535"/>
      <stop offset="100%" stop-color="#07000f"/>
    </radialGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53f6ff"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f5fff"/>
      <stop offset="100%" stop-color="#53f6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle purple radial glow top-left -->
  <radialGradient id="glow-tl" cx="20%" cy="20%" r="50%">
    <stop offset="0%" stop-color="#8f5fff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#8f5fff" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#glow-tl)"/>

  <!-- Cyan radial glow bottom-right -->
  <radialGradient id="glow-br" cx="80%" cy="80%" r="45%">
    <stop offset="0%" stop-color="#53f6ff" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#53f6ff" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#glow-br)"/>

  <!-- Bar chart bars -->
  <!-- Bar 1 (shortest, left) -->
  <rect x="72" y="310" width="62" height="130" rx="10" fill="url(#grad2)" opacity="0.7" filter="url(#glow)"/>
  <!-- Bar 2 -->
  <rect x="154" y="240" width="62" height="200" rx="10" fill="url(#grad1)" opacity="0.85" filter="url(#glow)"/>
  <!-- Bar 3 (tallest, center) -->
  <rect x="236" y="160" width="62" height="280" rx="10" fill="url(#grad1)" filter="url(#glow2)"/>
  <!-- Bar 4 -->
  <rect x="318" y="210" width="62" height="230" rx="10" fill="url(#grad2)" opacity="0.9" filter="url(#glow)"/>
  <!-- Bar 5 (right) -->
  <rect x="400" y="270" width="62" height="170" rx="10" fill="url(#grad1)" opacity="0.7" filter="url(#glow)"/>

  <!-- Trend line over bars -->
  <polyline points="103,290 185,220 267,140 349,190 431,250"
    fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow2)" opacity="0.9"/>

  <!-- Dots on trend line -->
  <circle cx="103" cy="290" r="10" fill="#53f6ff" filter="url(#glow2)"/>
  <circle cx="185" cy="220" r="10" fill="#53f6ff" filter="url(#glow2)"/>
  <circle cx="267" cy="140" r="12" fill="#ff4fd8" filter="url(#glow2)"/>
  <circle cx="349" cy="190" r="10" fill="#53f6ff" filter="url(#glow2)"/>
  <circle cx="431" cy="250" r="10" fill="#8f5fff" filter="url(#glow2)"/>

  <!-- Musical note (top left) -->
  <g transform="translate(68,52)" opacity="0.6">
    <ellipse cx="22" cy="52" rx="13" ry="9" fill="#53f6ff" filter="url(#glow)"/>
    <rect x="33" y="10" width="6" height="43" rx="3" fill="#53f6ff"/>
    <rect x="33" y="10" width="22" height="5" rx="2.5" fill="#53f6ff"/>
    <rect x="55" y="10" width="6" height="30" rx="3" fill="#53f6ff"/>
    <ellipse cx="61" cy="40" rx="10" ry="7" fill="#53f6ff"/>
  </g>

  <!-- "1" badge top right -->
  <circle cx="406" cy="96" r="44" fill="url(#grad1)" filter="url(#glow2)"/>
  <text x="406" y="110" text-anchor="middle" font-family="'Outfit',system-ui,sans-serif" font-weight="900" font-size="52" fill="#07000f">#1</text>

  <!-- Bottom baseline -->
  <line x1="60" y1="452" x2="452" y2="452" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/>
</svg>
