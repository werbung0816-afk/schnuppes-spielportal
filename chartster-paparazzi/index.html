<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chartster Paparazzi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#53f6ff;--pink:#ff4fd8;--purple:#8f5fff;
  --bg:#07000f;--glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.10);
  --text:rgba(240,240,255,1);--muted:rgba(240,240,255,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--bg);
  background-image:radial-gradient(ellipse 60% 50% at 15% 40%,rgba(143,95,255,.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(83,246,255,.12) 0%,transparent 60%),
    radial-gradient(ellipse 45% 45% at 65% 85%,rgba(255,79,216,.12) 0%,transparent 60%);
  min-height:100vh;color:var(--text);overflow:hidden}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;width:100%;padding:16px;align-items:center;justify-content:center;flex-direction:column}
.screen.active{display:flex}

/* ── LOBBY CARD ── */
.card{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:24px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.sep{width:100%;height:1px;background:var(--glass-b)}
.title-row{display:flex;align-items:flex-end;gap:6px}
.game-title{font-size:36px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(83,246,255,.4))}
.version{font-size:12px;font-weight:700;color:var(--muted);padding-bottom:5px;letter-spacing:.04em}
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;width:100%}
.btn{width:100%;padding:16px;border-radius:14px;font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;transition:all .2s;border:none;outline:none;touch-action:manipulation;user-select:none;cursor:default}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4);box-shadow:0 0 20px rgba(83,246,255,.12)}
.btn-primary:active{box-shadow:0 0 32px rgba(83,246,255,.4)}

/* ── LOBBY TABLE SELECTOR (Chartster-identisch) ── */
#table-selector{width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.ts-top-row,.ts-bot-row{display:flex;gap:32px;justify-content:center;padding:8px 0}
.ts-mid-row{display:flex;align-items:center;justify-content:center;width:100%;padding:4px 0}
#ts-table-body{width:280px;height:132px;flex:none;margin:0 8px;background:url('../chartster/icons/table.png') center/contain no-repeat;position:relative;filter:drop-shadow(0 4px 24px rgba(143,95,255,.5))}
.ts-side{display:flex;align-items:center;justify-content:center;padding:4px 0;flex:1}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px;cursor:default}
.seat-inp{width:92px;background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:6px 8px;color:var(--text);font-family:'Outfit',sans-serif;font-size:12px;outline:none;display:none;text-align:center;caret-color:var(--cyan)}
.seat.active .seat-inp{display:block}
.ts-side .seat-inp{width:72px}
.seat-circle{width:52px;height:52px;border-radius:50%;border:2px dashed rgba(83,246,255,.3);display:flex;align-items:center;justify-content:center;transition:all .25s;background:rgba(83,246,255,.04);position:relative;overflow:hidden;color:rgba(83,246,255,.4);box-shadow:0 0 8px rgba(83,246,255,.08)}
.seat.active .seat-circle{border-style:solid;border-width:2.5px;color:#07000f}
.seat.active .seat-circle::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.18),transparent 70%)}

/* ── LOBBY OPTIONS ── */
.setup-section{width:100%;display:flex;flex-direction:column;gap:8px}
.opt-row{display:flex;gap:10px;width:100%}
.opt-btn{flex:1;padding:13px 10px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);color:var(--muted);font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;transition:all .2s;touch-action:manipulation;cursor:default}
.opt-btn.sel{border-color:var(--purple);color:var(--purple);background:rgba(143,95,255,.12)}
#lobby-status{font-size:13px;color:var(--muted);text-align:center}

/* ── GAME SCREEN ── */
#screen-game{padding:8px;gap:8px}

/* Score bar */
#scores-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:500px}
.score-chip{padding:5px 12px;border-radius:20px;font-weight:800;font-size:14px;color:#07000f;display:flex;align-items:center;gap:4px}
.score-chip.bump{animation:scoreBump .32s ease}
@keyframes scoreBump{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.sc-name{font-size:12px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-pts{font-size:18px;font-weight:900;min-width:12px;text-align:right}

/* ── ARENA ── */
#arena{
  display:grid;
  grid-template-areas:
    ".    top   ."
    "left center right"
    ".    bot   .";
  grid-template-columns:72px 1fr 72px;
  grid-template-rows:auto auto auto;
  width:min(700px,calc(100vw - 16px));
  align-items:center;
  justify-items:stretch;
}

#area-top   {grid-area:top;   display:flex;justify-content:space-around;align-items:center;}
#area-bot   {grid-area:bot;   display:flex;justify-content:space-around;align-items:center;}
#area-left  {grid-area:left;  display:flex;align-items:center;justify-content:center;}
#area-right {grid-area:right; display:flex;align-items:center;justify-content:center;}
#area-center{grid-area:center;aspect-ratio:1/1;position:relative;width:100%;}

/* Image */
#image-container{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#12041f;border:2px solid rgba(83,246,255,.2);box-shadow:0 0 50px rgba(83,246,255,.1)}
#artist-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#pixel-canvas{position:absolute;inset:0;width:100%;height:100%;display:none}

/* Judge overlay */
#judge-overlay{position:absolute;inset:0;border-radius:17px;background:rgba(7,0,15,.85);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20}
#judge-overlay.show{display:flex}
#judge-lbl{font-size:18px;font-weight:800;text-align:center;padding:0 20px;line-height:1.3}
.judge-row{display:flex;gap:12px;padding:0 16px;width:100%}
.judge-btn{flex:1;padding:14px 8px;border-radius:12px;border:none;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;touch-action:manipulation;cursor:default;transition:transform .1s}
.judge-btn:active{transform:scale(.94)}
.j-correct{background:rgba(83,246,255,.15);color:var(--cyan);border:1px solid rgba(83,246,255,.45)}
.j-wrong{background:rgba(255,79,216,.12);color:var(--pink);border:1px solid rgba(255,79,216,.4)}

/* ── BUZZERS ── */
.buzzer-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.bzz-rot-180{transform:rotate(180deg)}
.bzz-rot-90{transform:rotate(90deg)}
.bzz-rot-270{transform:rotate(270deg)}
.buzzer-outer{position:relative;width:54px;height:54px;flex-shrink:0}
.buzzer-btn{position:absolute;inset:0;border-radius:50%;border:none;touch-action:manipulation;user-select:none;cursor:default;
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 7px 20px rgba(0,0,0,.3),inset 0 2px 7px rgba(255,255,255,.28);
  transition:transform .1s,box-shadow .1s;z-index:1}
.buzzer-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45),0 3px 10px rgba(0,0,0,.25),inset 0 2px 7px rgba(255,255,255,.28)}
.buzzer-btn.disabled{opacity:.28;pointer-events:none}
.buzzer-ring{position:absolute;top:50%;left:50%;width:100%;height:100%;border-radius:50%;border:4px solid;transform:translate(-50%,-50%);pointer-events:none;opacity:0}
.buzzer-ring.pulsing{animation:ringPulse 1.15s ease-out infinite}
@keyframes ringPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.buzzer-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}

/* ── SOLUTION OVERLAY ── */
#solution-overlay{
  position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  background:var(--bg);
  background-image:radial-gradient(ellipse 60% 50% at 15% 40%,rgba(143,95,255,.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(83,246,255,.12) 0%,transparent 60%),
    radial-gradient(ellipse 45% 45% at 65% 85%,rgba(255,79,216,.12) 0%,transparent 60%);
}
#solution-overlay.show{display:flex}
/* Edge labels */
#sol-labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.sol-lbl{position:absolute;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.6}
.sol-lbl.top-l{top:14px;left:18px}
.sol-lbl.top-r{top:14px;right:18px}
.sol-lbl.bot-l{bottom:14px;left:18px}
.sol-lbl.bot-r{bottom:14px;right:18px}
.sol-lbl.left{left:14px;top:50%;transform:translateY(-50%) rotate(-90deg)}
.sol-lbl.right{right:14px;top:50%;transform:translateY(-50%) rotate(90deg)}
/* Content */
#sol-content{flex:1;display:flex;flex-direction:row;align-items:stretch;padding:40px 32px;gap:24px;min-height:0;position:relative;z-index:2}
#sol-img-side{flex:0 0 56%;display:flex;align-items:center;justify-content:center}
#sol-img-frame{width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.12);box-shadow:0 0 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06)}
#sol-img-frame img{width:100%;height:100%;object-fit:cover;display:block}
#sol-info-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:8px}
#sol-artist-name{font-size:clamp(30px,6.5vw,66px);font-weight:900;line-height:1.1;text-align:center;
  background:linear-gradient(155deg,var(--cyan) 0%,var(--pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(83,246,255,.3));animation:glow-in .4s ease;word-break:break-word}
@keyframes glow-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
#sol-result{font-size:14px;font-weight:700;text-align:center;color:var(--muted)}
.sol-weiter-btn{padding:16px 40px;border-radius:14px;background:linear-gradient(135deg,rgba(255,79,216,.18),rgba(143,95,255,.18));color:var(--pink);border:1px solid rgba(255,79,216,.4);font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;touch-action:manipulation;cursor:default;box-shadow:0 0 20px rgba(255,79,216,.1);transition:all .2s}
.sol-weiter-btn:active{transform:scale(.96)}

/* ── VICTORY ── */
#victoryOverlay{position:fixed;inset:0;background:rgba(7,0,15,.96);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#victoryOverlay.show{display:flex}
.v-stage{text-align:center;animation:glow-in .5s ease;max-width:400px}
.v-comment{font-size:20px;color:var(--muted);margin-bottom:10px;font-weight:600}
.v-place{font-size:26px;font-weight:900;color:var(--muted);margin-bottom:12px}
.v-name{font-size:clamp(44px,10vw,64px);font-weight:900;line-height:1.1;margin-bottom:6px}
.v-score{font-size:24px;font-weight:700}
.vgold .v-name{background:linear-gradient(135deg,#ffd700,#ffb300);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,215,0,.4))}
.vsilver .v-name{background:linear-gradient(135deg,#d0d0d0,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vbronze .v-name{background:linear-gradient(135deg,#cd7f32,#a0522d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vfinal-btn{margin-top:24px;padding:16px 44px;border-radius:14px;background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4);font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;cursor:default;touch-action:manipulation}
.vfinal-btn:active{transform:scale(.97)}

/* ── UTILS ── */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
@keyframes cf-fall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
#hint-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 24px;font-size:16px;font-weight:600;z-index:999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;max-width:88vw;text-align:center}
#hint-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- ════ LOBBY ════ -->
<div id="screen-lobby" class="screen active">
<div class="card">
  <div class="title-row">
    <div class="game-title">Chartster Paparazzi</div>
    <div class="version">v1.1</div>
  </div>

  <div class="label">Spieler &amp; Teams</div>
  <div id="table-selector">
    <div class="ts-top-row">
      <div class="seat" data-pos="top-l" onclick="toggleSeat('top-l')">
        <div class="seat-circle"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
        <input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()">
      </div>
      <div class="seat" data-pos="top-r" onclick="toggleSeat('top-r')">
        <div class="seat-circle"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
        <input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()">
      </div>
    </div>
    <div class="ts-mid-row">
      <div class="ts-side">
        <div class="seat" data-pos="left" onclick="toggleSeat('left')">
          <div class="seat-circle"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()">
        </div>
      </div>
      <div id="ts-table-body"></div>
      <div class="ts-side">
        <div class="seat" data-pos="right" onclick="toggleSeat('right')">
          <div class="seat-circle"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()">
        </div>
      </div>
    </div>
    <div class="ts-bot-row">
      <div class="seat" data-pos="bot-l" onclick="toggleSeat('bot-l')">
        <div class="seat-circle"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
        <input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()">
      </div>
      <div class="seat" data-pos="bot-r" onclick="toggleSeat('bot-r')">
        <div class="seat-circle"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
        <input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()">
      </div>
    </div>
  </div>

  <div class="sep"></div>
  <div class="label">Bild-Auflösung</div>
  <div class="setup-section">
    <div class="opt-row">
      <button class="opt-btn sel" data-mode="blur"  onclick="selMode(this)">Blur</button>
      <button class="opt-btn"     data-mode="pixel" onclick="selMode(this)">Pixel</button>
    </div>
  </div>
  <div class="label">Punkte zum Sieg</div>
  <div class="setup-section">
    <div class="opt-row">
      <button class="opt-btn"     data-t="3" onclick="selTarget(this)">3</button>
      <button class="opt-btn sel" data-t="5" onclick="selTarget(this)">5</button>
      <button class="opt-btn"     data-t="7" onclick="selTarget(this)">7</button>
    </div>
  </div>
  <div class="sep"></div>
  <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>Spiel starten</button>
  <div id="lobby-status">Lade Songs ...</div>
</div>
</div>

<!-- ════ GAME ════ -->
<div id="screen-game" class="screen">
  <div id="scores-bar"></div>
  <div id="arena">
    <div id="area-top"></div>
    <div id="area-left"></div>
    <div id="area-center">
      <div id="image-container">
        <img id="artist-img" alt="" crossorigin="anonymous">
        <canvas id="pixel-canvas"></canvas>
      </div>
      <div id="judge-overlay">
        <div id="judge-lbl"></div>
        <div class="judge-row">
          <button class="judge-btn j-correct" onclick="judgeAnswer(true)">Richtig</button>
          <button class="judge-btn j-wrong"   onclick="judgeAnswer(false)">Falsch</button>
        </div>
      </div>
    </div>
    <div id="area-right"></div>
    <div id="area-bot"></div>
  </div>
</div>

<!-- ════ SOLUTION OVERLAY ════ -->
<div id="solution-overlay">
  <div id="sol-labels"></div>
  <div id="sol-content">
    <div id="sol-img-side">
      <div id="sol-img-frame"><img id="sol-img" alt="" crossorigin="anonymous"></div>
    </div>
    <div id="sol-info-side">
      <div id="sol-artist-name"></div>
      <div id="sol-result"></div>
      <button class="sol-weiter-btn" onclick="nextRound()">Weiter</button>
    </div>
  </div>
</div>

<!-- ════ VICTORY & UTILS ════ -->
<div id="victoryOverlay"></div>
<div id="confetti"></div>
<div id="hint-toast"></div>

<script>
// ══════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════
const COLORS    = ['#53f6ff','#ff4fd8','#8f5fff','#4dff91','#ffd84d','#ff6b35'];
const CW_ORDER  = ['bot-l','left','top-r','top-l','right','bot-r'];
const DEFAULTS  = ['Helden','Legenden','Stars','Cracks','Profis','Champs'];

const SEAT_AREA = {'top-l':'area-top','top-r':'area-top','left':'area-left','right':'area-right','bot-l':'area-bot','bot-r':'area-bot'};
const SEAT_ROT  = {'top-l':'bzz-rot-180','top-r':'bzz-rot-180','left':'bzz-rot-90','right':'bzz-rot-270','bot-l':'','bot-r':''};

const BLUR_STAGES = [
  {v:60,t:600},{v:50,t:600},{v:40,t:600},{v:32,t:600},{v:25,t:600},
  {v:20,t:1500},{v:16,t:1500},{v:13,t:1500},{v:10,t:1500},
  {v:8,t:1500},{v:6,t:1500},{v:1,t:1500},{v:0,t:0}
];
const PIXEL_STAGES = [
  {v:60,t:600},{v:48,t:600},{v:38,t:600},{v:30,t:600},{v:24,t:600},
  {v:19,t:1600},{v:14,t:1600},{v:10,t:1600},{v:7,t:1600},
  {v:4,t:1600},{v:2,t:1600},{v:1,t:1600},{v:0,t:0}
];

const MEDALS = [
  {place:'1. Platz',cls:'vgold',  coms:['ABSOLUTE LEGENDE!','PAPARAZZI-IKONE!','UNSCHLAGBAR!']},
  {place:'2. Platz',cls:'vsilver',coms:['KNAPP DANEBEN!','SO NAH!']},
  {place:'3. Platz',cls:'vbronze',coms:['STARK GEKÄMPFT!','PODIUM ERREICHT!']},
  {place:'4. Platz',cls:'',       coms:['NÄCHSTE RUNDE!']},
  {place:'5. Platz',cls:'',       coms:['WEITER ÜBEN!']},
  {place:'6. Platz',cls:'',       coms:['MUTIG DABEI!']},
];

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
var G = {
  seatCfg: {},       // pos -> {color, defaultName} or null
  teams: [],
  songPool: [],
  usedSongs: new Set(),
  current: null,
  mode: 'blur',
  winTarget: 5,
  phase: 'idle',     // idle | revealing | buzzed | answer
  stageIdx: 0,
  stageTimer: null,
  buzzedTeam: -1,
  round: 0,
};
CW_ORDER.forEach(function(p){ G.seatCfg[p] = null; });

// ══════════════════════════════════════
//  LOBBY
// ══════════════════════════════════════
function toggleSeat(pos) {
  var seat = document.querySelector('.seat[data-pos="' + pos + '"]');
  var wasActive = seat.classList.contains('active');
  if (wasActive) {
    if (activeSeatCount() <= 1) { showHint('Mindestens 1 Team!'); return; }
    seat.classList.remove('active');
    seat.querySelector('.seat-inp').value = '';
    G.seatCfg[pos] = null;
  } else {
    seat.classList.add('active');
    G.seatCfg[pos] = {};
  }
  reassignColors();
  checkStart();
}

function reassignColors() {
  var ci = 0;
  CW_ORDER.forEach(function(pos) {
    var seat = document.querySelector('.seat[data-pos="' + pos + '"]');
    if (!seat) return;
    var sc = seat.querySelector('.seat-circle');
    if (seat.classList.contains('active')) {
      var col = COLORS[ci];
      sc.style.borderColor = col;
      sc.style.borderStyle = 'solid';
      sc.style.background  = col;
      sc.style.color       = '#07000f';
      sc.style.boxShadow   = '0 0 18px ' + col + '66';
      var inp = seat.querySelector('.seat-inp');
      if (!inp.value) inp.placeholder = DEFAULTS[ci];
      G.seatCfg[pos] = { color: col, defaultName: DEFAULTS[ci] };
      ci++;
    } else {
      sc.style.borderColor = '';
      sc.style.borderStyle = '';
      sc.style.background  = '';
      sc.style.color       = '';
      sc.style.boxShadow   = '';
      G.seatCfg[pos] = null;
    }
  });
}

function activeSeatCount() {
  return CW_ORDER.filter(function(p){ return G.seatCfg[p] !== null; }).length;
}

function selMode(btn) {
  document.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.remove('sel'); });
  btn.classList.add('sel');
  G.mode = btn.dataset.mode;
}

function selTarget(btn) {
  document.querySelectorAll('[data-t]').forEach(function(b){ b.classList.remove('sel'); });
  btn.classList.add('sel');
  G.winTarget = parseInt(btn.dataset.t);
}

function checkStart() {
  document.getElementById('start-btn').disabled = !(G.songPool.length > 0 && activeSeatCount() >= 1);
}

// Activate default seats
['bot-l','bot-r'].forEach(function(p) {
  var s = document.querySelector('.seat[data-pos="' + p + '"]');
  if (s) { s.classList.add('active'); G.seatCfg[p] = {}; }
});
reassignColors();

// ══════════════════════════════════════
//  SONGS
// ══════════════════════════════════════
function loadSongs() {
  fetch('../chartster/songs.json')
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(data) {
      function hasCover(s){ return !!(s.c || s.cover); }
      G.songPool = data.filter(function(s){ return hasCover(s) && s.p && parseInt(s.p) <= 20; });
      if (G.songPool.length === 0) G.songPool = data.filter(hasCover);
      var stat = document.getElementById('lobby-status');
      stat.textContent = G.songPool.length > 0
        ? G.songPool.length + ' Künstler-Bilder gefunden'
        : 'Keine Künstlerbilder in songs.json gefunden';
      checkStart();
    })
    .catch(function() {
      document.getElementById('lobby-status').textContent = 'songs.json nicht gefunden';
    });
}
loadSongs();

// ══════════════════════════════════════
//  GAME START
// ══════════════════════════════════════
function startGame() {
  G.teams = [];
  var ci = 0;
  CW_ORDER.forEach(function(pos) {
    var seat = document.querySelector('.seat[data-pos="' + pos + '"]');
    if (!seat || !seat.classList.contains('active')) return;
    var inp  = seat.querySelector('.seat-inp');
    var name = (inp.value.trim()) || (G.seatCfg[pos] && G.seatCfg[pos].defaultName) || DEFAULTS[ci];
    G.teams.push({ pos: pos, name: name, color: COLORS[ci], score: 0, idx: ci });
    ci++;
  });

  G.usedSongs.clear();
  G.round = 0;
  showScreen('game');
  renderScores();
  renderBuzzers();
  renderSolLabels();
  nextRound();
}

function showScreen(n) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('screen-' + n).classList.add('active');
}

// ══════════════════════════════════════
//  SCORES
// ══════════════════════════════════════
function renderScores() {
  document.getElementById('scores-bar').innerHTML = G.teams.map(function(t) {
    return '<div class="score-chip" id="chip-' + t.idx + '" style="background:' + t.color + '">' +
      '<span class="sc-name">' + t.name + '</span>' +
      '<span class="sc-pts" id="spts-' + t.idx + '">' + t.score + '</span></div>';
  }).join('');
}

function updateScores() {
  G.teams.forEach(function(t) {
    var el = document.getElementById('spts-' + t.idx);
    if (el) el.textContent = t.score;
    var chip = document.getElementById('chip-' + t.idx);
    if (chip) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  });
}

// ══════════════════════════════════════
//  BUZZERS
// ══════════════════════════════════════
function renderBuzzers() {
  ['area-top','area-left','area-right','area-bot'].forEach(function(id) {
    document.getElementById(id).innerHTML = '';
  });

  G.teams.forEach(function(t) {
    var areaId = SEAT_AREA[t.pos];
    var area   = document.getElementById(areaId);
    var rot    = SEAT_ROT[t.pos];

    var wrap = document.createElement('div');
    wrap.className = 'buzzer-wrap' + (rot ? ' ' + rot : '');
    wrap.innerHTML =
      '<div class="buzzer-outer">' +
        '<div class="buzzer-ring" id="bring-' + t.idx + '" style="border-color:' + t.color + '"></div>' +
        '<button class="buzzer-btn disabled" id="bzz-' + t.idx + '" style="background:' + t.color + '" ' +
          'ontouchstart="onBuzz(' + t.idx + ',event)" onclick="onBuzz(' + t.idx + ',event)"></button>' +
      '</div>' +
      '<div class="buzzer-name" style="color:' + t.color + '">' + t.name + '</div>';

    area.appendChild(wrap);
  });

  // Top/bot: show with padding when populated, collapse when empty
  ['area-top','area-bot'].forEach(function(id) {
    var el = document.getElementById(id);
    var has = el.children.length > 0;
    el.style.minHeight = has ? '76px' : '0';
    el.style.padding   = has ? '6px 0' : '0';
  });
  // Side areas: keep column width for alignment, hide content if empty
  ['area-left','area-right'].forEach(function(id) {
    var el = document.getElementById(id);
    el.style.visibility = el.children.length > 0 ? 'visible' : 'hidden';
  });
}

function renderSolLabels() {
  var wrap = document.getElementById('sol-labels');
  wrap.innerHTML = '';
  G.teams.forEach(function(t) {
    var lbl = document.createElement('div');
    lbl.className = 'sol-lbl ' + t.pos;
    lbl.style.color = t.color;
    lbl.textContent = t.name;
    wrap.appendChild(lbl);
  });
}

function setBuzzers(active) {
  G.teams.forEach(function(t) {
    var btn  = document.getElementById('bzz-' + t.idx);
    var ring = document.getElementById('bring-' + t.idx);
    if (!btn) return;
    btn.classList.toggle('disabled', !active);
    ring.classList.toggle('pulsing', active);
  });
}

// ══════════════════════════════════════
//  ROUNDS
// ══════════════════════════════════════
function nextRound() {
  document.getElementById('solution-overlay').classList.remove('show');
  clearTimer();
  G.buzzedTeam = -1;
  G.phase = 'idle';
  document.getElementById('judge-overlay').classList.remove('show');
  setBuzzers(false);

  var pool = G.songPool.filter(function(s){ return !G.usedSongs.has(s); });
  if (pool.length === 0) { G.usedSongs.clear(); pool = G.songPool.slice(); }
  if (pool.length === 0) { showHint('Keine Songs mehr!'); return; }

  G.current = pool[Math.floor(Math.random() * pool.length)];
  G.usedSongs.add(G.current);
  G.round++;

  loadAndReveal();
}

// ══════════════════════════════════════
//  IMAGE + REVEAL
// ══════════════════════════════════════
function getCover(s) { return s.c || s.cover || ''; }

function loadAndReveal() {
  var song   = G.current;
  var url    = getCover(song);
  var imgEl  = document.getElementById('artist-img');
  var canvas = document.getElementById('pixel-canvas');

  imgEl.style.filter     = 'none';
  imgEl.style.transition = '';
  canvas.style.display   = 'none';

  if (!url) { G.usedSongs.add(song); nextRound(); return; }

  imgEl.onload = function() {
    var c    = document.getElementById('image-container');
    var size = c.offsetWidth || 260;
    canvas.width  = size;
    canvas.height = size;

    G.stageIdx = 0;
    G.phase    = 'revealing';

    if (G.mode === 'blur') {
      imgEl.style.transition = '';
      imgEl.style.filter = 'blur(' + BLUR_STAGES[0].v + 'px)';
      canvas.style.display = 'none';
    } else {
      imgEl.style.filter = 'none';
      canvas.style.display = 'block';
      drawPixel(PIXEL_STAGES[0].v);
    }

    setBuzzers(true);
    scheduleNext();
  };

  imgEl.onerror = function() { G.usedSongs.add(song); nextRound(); };
  imgEl.src = url;
}

function scheduleNext() {
  var stages = G.mode === 'blur' ? BLUR_STAGES : PIXEL_STAGES;
  var cur    = stages[G.stageIdx];
  if (!cur || cur.t === 0) { onFullyRevealed(); return; }

  G.stageTimer = setTimeout(function() {
    G.stageIdx++;
    var nxt = stages[G.stageIdx];
    if (!nxt) { onFullyRevealed(); return; }

    if (G.mode === 'blur') {
      var imgEl = document.getElementById('artist-img');
      imgEl.style.transition = 'filter ' + Math.min(Math.round(cur.t * 0.7), 500) + 'ms ease';
      imgEl.style.filter = nxt.v === 0 ? 'none' : 'blur(' + nxt.v + 'px)';
    } else {
      if (nxt.v === 0) {
        document.getElementById('pixel-canvas').style.display = 'none';
      } else {
        drawPixel(nxt.v);
      }
    }
    if (nxt.v === 0) onFullyRevealed();
    else             scheduleNext();
  }, cur.t);
}

function clearTimer() {
  if (G.stageTimer) { clearTimeout(G.stageTimer); G.stageTimer = null; }
}

function drawPixel(blockSize) {
  var canvas = document.getElementById('pixel-canvas');
  var imgEl  = document.getElementById('artist-img');
  if (!imgEl.naturalWidth) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.imageSmoothingEnabled = false;
  var cols = Math.max(1, Math.round(w / blockSize));
  var rows = Math.max(1, Math.round(h / blockSize));
  var off = document.createElement('canvas');
  off.width = cols; off.height = rows;
  var offCtx = off.getContext('2d');
  try {
    offCtx.drawImage(imgEl, 0, 0, cols, rows);
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(off, 0, 0, cols, rows, 0, 0, w, h);
  } catch(e) {
    canvas.style.display = 'none';
    document.getElementById('artist-img').style.filter = 'blur(' + Math.round(blockSize / 3) + 'px)';
  }
}

function onFullyRevealed() {
  clearTimer();
  var imgEl = document.getElementById('artist-img');
  imgEl.style.transition = 'filter .4s ease';
  imgEl.style.filter = 'none';
  document.getElementById('pixel-canvas').style.display = 'none';
  setBuzzers(false);
  G.buzzedTeam = -1;
  showSolution(null, false);
}

// ══════════════════════════════════════
//  BUZZ
// ══════════════════════════════════════
var _lastBuzz = 0;
function onBuzz(teamIdx, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  var now = Date.now();
  if (now - _lastBuzz < 280) return;
  _lastBuzz = now;
  if (G.phase !== 'revealing') return;

  G.phase      = 'buzzed';
  G.buzzedTeam = teamIdx;
  clearTimer();
  setBuzzers(false);

  // 1. Bild sofort scharf stellen
  var imgEl = document.getElementById('artist-img');
  imgEl.style.transition = 'filter .35s ease';
  imgEl.style.filter = 'none';
  document.getElementById('pixel-canvas').style.display = 'none';

  // 2. Richtig/Falsch erst nach Aufdecken anzeigen
  var team = G.teams.find(function(t){ return t.idx === teamIdx; });
  setTimeout(function() {
    document.getElementById('judge-lbl').innerHTML =
      '<span style="color:' + team.color + '">' + team.name + '</span> hat gebuzzert!';
    document.getElementById('judge-overlay').classList.add('show');
  }, 380);
}

function judgeAnswer(correct) {
  var team = G.teams.find(function(t){ return t.idx === G.buzzedTeam; });
  document.getElementById('judge-overlay').classList.remove('show');

  team.score += correct ? 1 : -1;
  updateScores();

  if (correct) spawnConfetti(team.color, 80, true);

  G.phase = 'answer';

  if (correct && team.score >= G.winTarget) {
    setTimeout(showVictory, 500);
    return;
  }

  setTimeout(function(){ showSolution(team, correct); }, 300);
}

// ══════════════════════════════════════
//  SOLUTION OVERLAY
// ══════════════════════════════════════
function showSolution(team, wasCorrect) {
  setBuzzers(false);

  var song   = G.current;
  var artist = song.a || song.artist || song.Artist || '?';

  document.getElementById('sol-img').src = document.getElementById('artist-img').src;
  document.getElementById('sol-artist-name').textContent = artist;

  var rlbl = document.getElementById('sol-result');
  if (team && wasCorrect) {
    rlbl.innerHTML = '<span style="color:' + team.color + '">' + team.name + '</span>' +
      ' &mdash; +1 Punkt &mdash; Stand: ' + team.score;
  } else if (team && !wasCorrect) {
    rlbl.innerHTML = '<span style="color:' + team.color + '">' + team.name + '</span>' +
      ' &mdash; -1 Punkt &mdash; Stand: ' + team.score;
  } else {
    rlbl.textContent = 'Niemand hat erraten.';
  }

  renderSolLabels();
  document.getElementById('solution-overlay').classList.add('show');
}

// ══════════════════════════════════════
//  VICTORY
// ══════════════════════════════════════
function showVictory() {
  document.getElementById('solution-overlay').classList.remove('show');
  var sorted  = G.teams.slice().sort(function(a,b){ return b.score - a.score; });
  var overlay = document.getElementById('victoryOverlay');
  overlay.classList.add('show');
  var stage = 0;

  function render(i) {
    var t = sorted[i];
    var m = MEDALS[Math.min(i, MEDALS.length - 1)];
    var c = m.coms[Math.floor(Math.random() * m.coms.length)];
    var nameStyle = m.cls ? '' : 'color:' + t.color;
    overlay.innerHTML =
      '<div class="v-stage ' + m.cls + '">' +
      '<div class="v-comment">' + c + '</div>' +
      '<div class="v-place">' + m.place + '</div>' +
      '<div class="v-name" style="' + nameStyle + '">' + t.name + '</div>' +
      '<div class="v-score" style="color:' + t.color + '">' + t.score + ' Punkte</div>' +
      (i === sorted.length - 1 ? '<button class="vfinal-btn" onclick="doReset()">Neues Spiel</button>' : '') +
      '</div>';
    playApplause();
    spawnConfetti(t.color, i === 0 ? 150 : 50, false);
  }

  render(0);
  var iv = setInterval(function() {
    stage++;
    if (stage >= sorted.length) { clearInterval(iv); return; }
    render(stage);
  }, 3000);
}

function doReset() {
  document.getElementById('victoryOverlay').classList.remove('show');
  G.usedSongs.clear();
  G.round = 0;
  G.phase = 'idle';
  G.teams.forEach(function(t){ t.score = 0; });
  showScreen('lobby');
}

// ══════════════════════════════════════
//  UTILS
// ══════════════════════════════════════
function playApplause() {
  try { new Audio('../chartster/applause.mp3').play().catch(function(){}); } catch(e){}
}

function spawnConfetti(color, count, wave) {
  var c    = document.getElementById('confetti');
  var cols = [color,'#fff','#ffd84d',COLORS[Math.floor(Math.random()*COLORS.length)]];
  for (var i = 0; i < count; i++) {
    var p   = document.createElement('div');
    var sz  = 5 + Math.random() * 12;
    var dur = 1.2 + Math.random() * 1.8;
    p.style.cssText =
      'position:absolute;top:-20px;left:' + (Math.random()*100) + '%;' +
      'width:' + sz + 'px;height:' + sz + 'px;background:' + cols[i%cols.length] + ';' +
      'border-radius:' + (['50%','3px','0'][i%3]) + ';' +
      'transform:rotate(' + (Math.random()*360) + 'deg);' +
      'animation:cf-fall ' + dur + 's ' + (Math.random()*.6) + 's linear both';
    c.appendChild(p);
    setTimeout(function(el){ el.remove(); }, Math.ceil((dur + 0.8) * 1000), p);
  }
  if (wave) setTimeout(function(){ spawnConfetti(color, Math.floor(count*.35), false); }, 750);
}

function showHint(msg) {
  var el = document.getElementById('hint-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 3000);
}
</script>
</body>
