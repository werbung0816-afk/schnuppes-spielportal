<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chartster Paparazzi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#53f6ff;--pink:#ff4fd8;--purple:#8f5fff;
  --bg:#07000f;--glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.10);
  --text:rgba(240,240,255,1);--muted:rgba(240,240,255,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Outfit',sans-serif;background:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 15% 40%,rgba(143,95,255,.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(83,246,255,.12) 0%,transparent 60%),
    radial-gradient(ellipse 45% 45% at 65% 85%,rgba(255,79,216,.12) 0%,transparent 60%);
  min-height:100vh;color:var(--text);overflow-x:hidden;
}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;padding:16px;align-items:center;justify-content:center;flex-direction:column}
.screen.active{display:flex}

/* ── BASE COMPONENTS ── */
.card{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:24px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.sep{width:100%;height:1px;background:var(--glass-b)}
.game-title{font-size:36px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(83,246,255,.4));text-align:center}
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;width:100%}
.btn{width:100%;padding:16px;border-radius:14px;font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;transition:all .2s;border:none;outline:none;touch-action:manipulation;user-select:none;cursor:default}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4);box-shadow:0 0 20px rgba(83,246,255,.12)}
.btn-primary:active{box-shadow:0 0 32px rgba(83,246,255,.4);transform:scale(.98)}

/* ── LOBBY ── */
.setup-section{width:100%;display:flex;flex-direction:column;gap:8px}
.team-row{display:flex;align-items:center;gap:10px}
.team-dot{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#07000f;border:3px solid rgba(255,255,255,.15)}
.team-inp{flex:1;background:var(--glass);border:1px solid var(--glass-b);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;outline:none;caret-color:var(--cyan)}
.team-inp::placeholder{color:var(--muted)}
.team-inp:disabled{opacity:.3}
.team-tog{width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);color:var(--muted);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;touch-action:manipulation;cursor:default;transition:all .2s}
.team-tog.on{border-color:var(--cyan);color:var(--cyan);background:rgba(83,246,255,.08)}
.opt-row{display:flex;gap:10px;width:100%}
.opt-btn{flex:1;padding:13px 10px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);color:var(--muted);font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;transition:all .2s;touch-action:manipulation;cursor:default}
.opt-btn.sel{border-color:var(--purple);color:var(--purple);background:rgba(143,95,255,.12)}

/* ── GAME SCREEN ── */
#screen-game{padding:10px;justify-content:flex-start;gap:0}
#game-inner{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:8px}

/* Score bar */
#scores-bar{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
.score-chip{padding:5px 13px;border-radius:20px;font-weight:800;font-size:15px;color:#07000f;display:flex;align-items:center;gap:5px;transition:transform .2s}
.score-chip.bump{animation:scoreBump .35s ease}
@keyframes scoreBump{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.sc-name{font-size:13px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-pts{font-size:20px;font-weight:900;line-height:1}

/* Image container */
#image-container{
  position:relative;width:100%;max-width:360px;
  aspect-ratio:1/1;border-radius:20px;overflow:hidden;
  background:#12041f;border:2px solid rgba(83,246,255,.2);
  box-shadow:0 0 50px rgba(83,246,255,.1);flex-shrink:0;
}
#artist-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#pixel-canvas{position:absolute;inset:0;width:100%;height:100%;display:none;image-rendering:pixelated}
#reveal-flash{position:absolute;inset:0;background:rgba(255,255,255,.8);border-radius:18px;opacity:0;pointer-events:none;transition:opacity .15s}

/* Status */
#game-status{font-size:19px;font-weight:700;color:var(--muted);text-align:center;min-height:28px;padding:0 8px}

/* Judge panel */
#judge-panel{display:none;width:100%;background:rgba(255,79,216,.06);border:1px solid rgba(255,79,216,.3);border-radius:16px;padding:16px;flex-direction:column;align-items:center;gap:12px}
#judge-panel.show{display:flex}
.judge-team-lbl{font-size:19px;font-weight:800;text-align:center}
.judge-row{display:flex;gap:12px;width:100%}
.judge-btn{flex:1;padding:16px;border-radius:12px;border:none;font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;touch-action:manipulation;cursor:default;transition:all .15s}
.judge-btn:active{transform:scale(.95)}
.j-correct{background:rgba(83,246,255,.15);color:var(--cyan);border:1px solid rgba(83,246,255,.45)}
.j-wrong{background:rgba(255,79,216,.12);color:var(--pink);border:1px solid rgba(255,79,216,.4)}

/* Answer panel */
#answer-panel{display:none;width:100%;background:var(--glass);border:1px solid rgba(83,246,255,.22);border-radius:16px;padding:18px;flex-direction:column;align-items:center;gap:6px;text-align:center}
#answer-panel.show{display:flex}
#ans-artist{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow-in .4s ease}
#ans-title{font-size:16px;color:var(--muted)}
@keyframes glow-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}

/* Round info */
#round-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:360px}
.round-label{font-size:13px;color:var(--muted)}
.target-label{font-size:13px;color:var(--muted)}

/* ── BUZZERS ── */
#buzzers-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%;padding:6px 0 4px}
.buzzer-wrap{display:flex;flex-direction:column;align-items:center;gap:7px}
.buzzer-outer{
  position:relative;
  width:min(110px,27vw);
  height:min(110px,27vw);
}
.buzzer-btn{
  position:absolute;inset:0;
  border-radius:50%;border:none;
  font-size:clamp(26px,6vw,36px);
  color:#07000f;
  touch-action:manipulation;user-select:none;cursor:default;
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.3),inset 0 2px 8px rgba(255,255,255,.28);
  transition:transform .1s,box-shadow .1s;
  z-index:1;
}
.buzzer-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45),0 3px 10px rgba(0,0,0,.3),inset 0 2px 8px rgba(255,255,255,.28)}
.buzzer-btn.disabled{opacity:.3;pointer-events:none}
.buzzer-btn.buzzed-flash{animation:buzzFlash .3s ease}
@keyframes buzzFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.buzzer-ring{
  position:absolute;top:50%;left:50%;
  width:100%;height:100%;
  border-radius:50%;border:5px solid;
  transform:translate(-50%,-50%);
  pointer-events:none;opacity:0;
}
.buzzer-ring.pulsing{animation:ringPulse 1.15s ease-out infinite}
@keyframes ringPulse{
  0%{transform:translate(-50%,-50%) scale(1);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}
}
.buzzer-name{font-size:clamp(11px,2.8vw,14px);font-weight:700;max-width:min(110px,30vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);text-align:center}

/* ── VICTORY OVERLAY ── */
#victoryOverlay{position:fixed;inset:0;background:rgba(7,0,15,.96);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#victoryOverlay.show{display:flex}
.v-stage{text-align:center;animation:glow-in .5s ease;max-width:400px}
.v-comment{font-size:20px;color:var(--muted);margin-bottom:10px;font-weight:600}
.v-place{font-size:26px;font-weight:900;color:var(--muted);margin-bottom:12px}
.v-name{font-size:56px;font-weight:900;line-height:1.1;margin-bottom:6px}
.v-score{font-size:26px;font-weight:700}
.vgold .v-name{background:linear-gradient(135deg,#ffd700,#ffb300);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,215,0,.4))}
.vsilver .v-name{background:linear-gradient(135deg,#d0d0d0,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vbronze .v-name{background:linear-gradient(135deg,#cd7f32,#a0522d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vfinal-btn{margin-top:28px;padding:16px 44px;border-radius:14px;background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4);font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;cursor:default;touch-action:manipulation}
.vfinal-btn:active{transform:scale(.97)}

/* ── UTILITIES ── */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
@keyframes cf-fall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
#hint-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 24px;font-size:16px;font-weight:600;z-index:999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;max-width:90vw}
#hint-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#lobby-status{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<!-- ════ LOBBY ════ -->
<div id="screen-lobby" class="screen active">
<div class="card">
  <div class="game-title">📸 Chartster Paparazzi</div>

  <div class="label">Spieler & Teams</div>
  <div class="setup-section" id="teams-setup"></div>

  <div class="sep"></div>

  <div class="label">Bild-Auflösung</div>
  <div class="setup-section">
    <div class="opt-row">
      <button class="opt-btn sel" data-mode="blur" onclick="selMode(this)">🌫️ Blur</button>
      <button class="opt-btn" data-mode="pixel" onclick="selMode(this)">🔲 Pixel</button>
    </div>
  </div>

  <div class="label">Punkte zum Sieg</div>
  <div class="setup-section">
    <div class="opt-row">
      <button class="opt-btn" data-t="3" onclick="selTarget(this)">3</button>
      <button class="opt-btn sel" data-t="5" onclick="selTarget(this)">5</button>
      <button class="opt-btn" data-t="7" onclick="selTarget(this)">7</button>
    </div>
  </div>

  <div class="sep"></div>
  <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>Spiel starten</button>
  <div id="lobby-status">Lade Songs …</div>
</div>
</div>

<!-- ════ GAME ════ -->
<div id="screen-game" class="screen">
<div id="game-inner">
  <div id="round-bar">
    <div class="round-label" id="round-lbl">Runde 1</div>
    <div style="font-size:15px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent">📸 Paparazzi</div>
    <div class="target-label" id="target-lbl">Ziel: 5 Pkt</div>
  </div>

  <div id="scores-bar"></div>

  <div id="image-container">
    <img id="artist-img" alt="" crossorigin="anonymous">
    <canvas id="pixel-canvas"></canvas>
    <div id="reveal-flash"></div>
  </div>

  <div id="game-status">🤔 Wer ist dieser Künstler?</div>

  <div id="judge-panel">
    <div class="judge-team-lbl" id="judge-lbl"></div>
    <div class="judge-row">
      <button class="judge-btn j-correct" onclick="judgeAnswer(true)">✓ Richtig!</button>
      <button class="judge-btn j-wrong" onclick="judgeAnswer(false)">✗ Falsch!</button>
    </div>
  </div>

  <div id="answer-panel">
    <div id="ans-artist"></div>
    <div id="ans-title"></div>
    <button class="btn btn-primary" style="margin-top:10px;font-size:17px;padding:14px" onclick="nextRound()">▶ Nächster Künstler</button>
  </div>

  <div id="buzzers-grid"></div>
</div>
</div>

<!-- ════ VICTORY ════ -->
<div id="victoryOverlay"></div>
<div id="confetti"></div>
<div id="hint-toast"></div>

<script>
// ══════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════
const COLORS   = ['#53f6ff','#ff4fd8','#8f5fff','#4dff91','#ffd84d','#ff6b35'];
const DEF_NAMES= ['Team 1','Team 2','Team 3','Team 4','Team 5','Team 6'];

// Blur stages: value = px blur, t = ms until next stage
const BLUR_STAGES = [
  {v:60,t:600},{v:50,t:600},{v:40,t:600},{v:32,t:600},{v:25,t:600},
  {v:20,t:1500},{v:16,t:1500},{v:13,t:1500},{v:10,t:1500},
  {v:8,t:1500},{v:6,t:1500},{v:1,t:1500},{v:0,t:0}
];

// Pixel stages: value = block size in px (0 = remove canvas, show sharp img)
const PIXEL_STAGES = [
  {v:60,t:600},{v:48,t:600},{v:38,t:600},{v:30,t:600},{v:24,t:600},
  {v:19,t:1600},{v:14,t:1600},{v:10,t:1600},{v:7,t:1600},
  {v:4,t:1600},{v:2,t:1600},{v:1,t:1600},{v:0,t:0}
];

const MEDALS = [
  {place:'👑 1. Platz',cls:'vgold',  coms:['ABSOLUTE LEGENDE!','UNSCHLAGBAR!','PAPARAZZI-IKONE!']},
  {place:'🥈 2. Platz',cls:'vsilver',coms:['SO NAH!','KNAPP DANEBEN!']},
  {place:'🥉 3. Platz',cls:'vbronze',coms:['STARK GEKÄMPFT!','PODIUM ERREICHT!']},
  {place:'4. Platz',  cls:'',        coms:['NÄCHSTE RUNDE!']},
  {place:'5. Platz',  cls:'',        coms:['WEITER ÜBEN!']},
  {place:'6. Platz',  cls:'',        coms:['MUTIG DABEI!']},
];

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let G = {
  teams:[],
  songPool:[],
  usedSongs: new Set(),
  current: null,
  mode: 'blur',    // 'blur' | 'pixel'
  winTarget: 5,
  phase: 'idle',   // idle | revealing | buzzed | answer
  stageIdx: 0,
  stageTimer: null,
  buzzedTeam: -1,
  badBuzzers: new Set(),  // teams that guessed wrong this round
  round: 0,
  canvasSize: 360,
};

// ══════════════════════════════════════
//  LOBBY
// ══════════════════════════════════════
(function buildLobby() {
  const wrap = document.getElementById('teams-setup');
  wrap.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const on = i < 2;
    const row = document.createElement('div');
    row.className = 'team-row';
    row.id = 'trow-' + i;
    row.innerHTML =
      `<div class="team-dot" style="background:${COLORS[i]}">${i+1}</div>` +
      `<input class="team-inp" id="tinp-${i}" placeholder="${DEF_NAMES[i]}" ${on?'':'disabled'} oninput="checkStart()">` +
      `<button class="team-tog${on?' on':''}" id="ttog-${i}" onclick="togTeam(${i})">${on?'✓':'+'}</button>`;
    wrap.appendChild(row);
  }
})();

function togTeam(i) {
  const tog = document.getElementById('ttog-'+i);
  const inp = document.getElementById('tinp-'+i);
  const on  = tog.classList.contains('on');
  if (on && activeCnt() <= 1) { showHint('Mindestens 1 Team!'); return; }
  if (on) { tog.classList.remove('on'); tog.textContent='+'; inp.disabled=true; }
  else    { tog.classList.add('on');    tog.textContent='✓'; inp.disabled=false; }
  checkStart();
}

function activeCnt() {
  let n=0;
  for(let i=0;i<6;i++) if(document.getElementById('ttog-'+i)?.classList.contains('on')) n++;
  return n;
}

function getTeamsCfg() {
  const t=[];
  for(let i=0;i<6;i++){
    if(document.getElementById('ttog-'+i)?.classList.contains('on')){
      const nm=(document.getElementById('tinp-'+i)?.value.trim())||DEF_NAMES[i];
      t.push({idx:i,name:nm,color:COLORS[i],score:0});
    }
  }
  return t;
}

function selMode(btn) {
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  G.mode = btn.dataset.mode;
}

function selTarget(btn) {
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  G.winTarget = parseInt(btn.dataset.t);
}

function checkStart() {
  const ok = G.songPool.length > 0 && activeCnt() >= 1;
  document.getElementById('start-btn').disabled = !ok;
}

// ══════════════════════════════════════
//  LOAD SONGS
// ══════════════════════════════════════
function loadSongs() {
  fetch('../chartster/songs.json')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => {
      // filter: has cover image AND chart position ≤ 20
      const hasCover = s => !!(s.c || s.cover || s.img || s.artwork);
      G.songPool = data.filter(s => hasCover(s) && s.p && parseInt(s.p) <= 20);
      if (G.songPool.length === 0) {
        // fallback: any song with cover, any position
        G.songPool = data.filter(s => hasCover(s));
      }
      const stat = document.getElementById('lobby-status');
      stat.textContent = G.songPool.length > 0
        ? `${G.songPool.length} Künstler-Bilder gefunden`
        : '⚠ Keine Künstlerbilder in songs.json';
      checkStart();
    })
    .catch(() => {
      document.getElementById('lobby-status').textContent = '⚠ songs.json nicht gefunden';
    });
}
loadSongs();

// ══════════════════════════════════════
//  START GAME
// ══════════════════════════════════════
function startGame() {
  G.teams = getTeamsCfg();
  G.usedSongs.clear();
  G.round = 0;

  showScreen('game');
  document.getElementById('target-lbl').textContent = `Ziel: ${G.winTarget} Pkt`;
  renderScores();
  renderBuzzers();
  nextRound();
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

// ══════════════════════════════════════
//  SCORES
// ══════════════════════════════════════
function renderScores() {
  document.getElementById('scores-bar').innerHTML = G.teams.map(t =>
    `<div class="score-chip" id="chip-${t.idx}" style="background:${t.color}">` +
    `<span class="sc-name">${t.name}</span>` +
    `<span class="sc-pts" id="spts-${t.idx}">${t.score}</span></div>`
  ).join('');
}

function updateScores() {
  G.teams.forEach(t => {
    const el = document.getElementById('spts-'+t.idx);
    if (el) el.textContent = t.score;
    const chip = document.getElementById('chip-'+t.idx);
    if (chip) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  });
}

// ══════════════════════════════════════
//  BUZZERS
// ══════════════════════════════════════
function renderBuzzers() {
  document.getElementById('buzzers-grid').innerHTML = G.teams.map(t =>
    `<div class="buzzer-wrap">` +
    `<div class="buzzer-outer">` +
    `<div class="buzzer-ring" id="bring-${t.idx}" style="border-color:${t.color}"></div>` +
    `<button class="buzzer-btn disabled" id="bzz-${t.idx}" style="background:${t.color}" ` +
    `ontouchstart="onBuzz(${t.idx},event)" onclick="onBuzz(${t.idx},event)">🎯</button>` +
    `</div>` +
    `<div class="buzzer-name">${t.name}</div>` +
    `</div>`
  ).join('');
}

function setBuzzers(active) {
  G.teams.forEach(t => {
    const btn  = document.getElementById('bzz-'+t.idx);
    const ring = document.getElementById('bring-'+t.idx);
    if (!btn) return;
    const dis = !active || G.badBuzzers.has(t.idx);
    btn.classList.toggle('disabled', dis);
    ring.classList.toggle('pulsing', !dis);
  });
}

// ══════════════════════════════════════
//  ROUNDS
// ══════════════════════════════════════
function nextRound() {
  clearTimer();
  G.badBuzzers.clear();
  G.buzzedTeam = -1;
  G.phase = 'idle';

  document.getElementById('judge-panel').classList.remove('show');
  document.getElementById('answer-panel').classList.remove('show');
  document.getElementById('game-status').textContent = '⏳ Lade …';
  setBuzzers(false);

  // pick song
  let pool = G.songPool.filter(s => !G.usedSongs.has(s));
  if (pool.length === 0) { G.usedSongs.clear(); pool = G.songPool.slice(); }
  if (pool.length === 0) { showHint('Keine Songs mehr!'); return; }

  G.current = pool[Math.floor(Math.random() * pool.length)];
  G.usedSongs.add(G.current);
  G.round++;
  document.getElementById('round-lbl').textContent = 'Runde ' + G.round;

  loadAndReveal();
}

// ══════════════════════════════════════
//  IMAGE LOAD & REVEAL
// ══════════════════════════════════════
function getCoverUrl(song) {
  return song.c || song.cover || song.img || song.artwork || '';
}

function loadAndReveal() {
  const song    = G.current;
  const url     = getCoverUrl(song);
  const imgEl   = document.getElementById('artist-img');
  const canvas  = document.getElementById('pixel-canvas');

  // reset image state
  imgEl.style.filter     = 'none';
  imgEl.style.transition = '';
  canvas.style.display   = 'none';

  if (!url) { nextRound(); return; }

  imgEl.onload = () => {
    // compute canvas size
    const container = document.getElementById('image-container');
    G.canvasSize = container.offsetWidth || 360;
    canvas.width  = G.canvasSize;
    canvas.height = G.canvasSize;

    G.stageIdx = 0;
    G.phase    = 'revealing';

    if (G.mode === 'blur') {
      imgEl.style.filter = `blur(${BLUR_STAGES[0].v}px)`;
      canvas.style.display = 'none';
    } else {
      imgEl.style.filter = 'none';
      canvas.style.display = 'block';
      drawPixel(PIXEL_STAGES[0].v);
    }

    document.getElementById('game-status').textContent = '🤔 Wer ist dieser Künstler?';
    setBuzzers(true);
    scheduleNext();
  };

  imgEl.onerror = () => {
    G.usedSongs.add(song);
    nextRound();
  };

  imgEl.src = url;
}

function scheduleNext() {
  const stages = G.mode === 'blur' ? BLUR_STAGES : PIXEL_STAGES;
  const cur    = stages[G.stageIdx];
  if (!cur || cur.t === 0) { onFullyRevealed(); return; }

  G.stageTimer = setTimeout(() => {
    G.stageIdx++;
    const nxt = stages[G.stageIdx];
    if (!nxt) { onFullyRevealed(); return; }

    if (G.mode === 'blur') {
      const imgEl = document.getElementById('artist-img');
      imgEl.style.transition = `filter ${Math.min(cur.t * 0.75, 600)}ms ease`;
      imgEl.style.filter = nxt.v === 0 ? 'none' : `blur(${nxt.v}px)`;
    } else {
      if (nxt.v === 0) {
        document.getElementById('pixel-canvas').style.display = 'none';
      } else {
        drawPixel(nxt.v);
      }
    }

    if (nxt.v === 0) { onFullyRevealed(); }
    else             { scheduleNext(); }
  }, cur.t);
}

function clearTimer() {
  if (G.stageTimer) { clearTimeout(G.stageTimer); G.stageTimer = null; }
}

function drawPixel(blockSize) {
  const canvas = document.getElementById('pixel-canvas');
  const imgEl  = document.getElementById('artist-img');
  const ctx    = canvas.getContext('2d');
  const w      = canvas.width;
  const h      = canvas.height;

  if (!imgEl.naturalWidth) return;

  ctx.imageSmoothingEnabled = false;

  const cols = Math.max(1, Math.round(w / blockSize));
  const rows = Math.max(1, Math.round(h / blockSize));

  // draw small then scale up
  const off = document.createElement('canvas');
  off.width  = cols;
  off.height = rows;
  const offCtx = off.getContext('2d');
  try {
    offCtx.drawImage(imgEl, 0, 0, cols, rows);
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(off, 0, 0, cols, rows, 0, 0, w, h);
  } catch(e) {
    // CORS fallback: switch to blur mode silently
    canvas.style.display = 'none';
    const iEl = document.getElementById('artist-img');
    iEl.style.filter = `blur(${Math.round(blockSize / 3)}px)`;
  }
}

function onFullyRevealed() {
  clearTimer();
  G.phase = 'answer';

  // ensure sharp image visible
  const imgEl  = document.getElementById('artist-img');
  const canvas = document.getElementById('pixel-canvas');
  imgEl.style.transition = 'filter .5s ease';
  imgEl.style.filter     = 'none';
  canvas.style.display   = 'none';

  setBuzzers(false);
  showAnswer(false);
}

// ══════════════════════════════════════
//  BUZZ HANDLING
// ══════════════════════════════════════
let _lastBuzzTime = 0;
function onBuzz(teamIdx, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  // Debounce (touch + click both fire on mobile)
  const now = Date.now();
  if (now - _lastBuzzTime < 300) return;
  _lastBuzzTime = now;

  if (G.phase !== 'revealing') return;
  if (G.badBuzzers.has(teamIdx)) return;

  G.phase      = 'buzzed';
  G.buzzedTeam = teamIdx;
  clearTimer();
  setBuzzers(false);

  const team = G.teams.find(t => t.idx === teamIdx);

  // Flash the buzzer
  const btn = document.getElementById('bzz-'+teamIdx);
  if (btn) { btn.classList.add('buzzed-flash'); setTimeout(()=>btn.classList.remove('buzzed-flash'),350); }

  document.getElementById('judge-lbl').innerHTML =
    `🔴 <span style="color:${team.color}">${team.name}</span> hat gebuzzert!`;
  document.getElementById('judge-panel').classList.add('show');
  document.getElementById('game-status').textContent = '';
}

function judgeAnswer(correct) {
  const team = G.teams.find(t => t.idx === G.buzzedTeam);
  document.getElementById('judge-panel').classList.remove('show');

  if (correct) {
    team.score++;
    updateScores();
    spawnConfetti(team.color, 90, true);
    showHint(`✓ ${team.name}: +1 Punkt!`);

    if (team.score >= G.winTarget) {
      setTimeout(showVictory, 600);
      return;
    }
    // Reveal answer, then wait for "next" click
    revealImage();
    showAnswer(true);

  } else {
    team.score--;
    updateScores();
    showHint(`✗ ${team.name}: −1 Punkt!`);
    G.badBuzzers.add(G.buzzedTeam);

    const allBuzzed = G.teams.every(t => G.badBuzzers.has(t.idx));
    if (allBuzzed) {
      // All guessed wrong → show answer
      revealImage();
      showAnswer(false);
    } else {
      // Resume reveal, remaining teams can still buzz
      G.phase = 'revealing';
      G.buzzedTeam = -1;
      setBuzzers(true);
      document.getElementById('game-status').textContent = '🤔 Wer ist dieser Künstler?';
      scheduleNext();
    }
  }
}

function revealImage() {
  const imgEl  = document.getElementById('artist-img');
  const canvas = document.getElementById('pixel-canvas');
  imgEl.style.transition = 'filter .4s ease';
  imgEl.style.filter     = 'none';
  canvas.style.display   = 'none';
  // Flash effect
  const fl = document.getElementById('reveal-flash');
  fl.style.opacity = '1';
  setTimeout(() => { fl.style.opacity = '0'; }, 150);
}

function showAnswer(wasCorrect) {
  G.phase = 'answer';
  setBuzzers(false);

  const song    = G.current;
  const artist  = song.a || song.artist || song.Artist || '?';
  const title   = song.t || song.titel  || song.Titel  || '';

  document.getElementById('ans-artist').textContent = artist;
  document.getElementById('ans-title').textContent  = title ? `„${title}"` : '';
  document.getElementById('answer-panel').classList.add('show');

  document.getElementById('game-status').textContent =
    wasCorrect ? '🎉 Richtig erraten!' : '😅 Niemand hat\'s gewusst …';
}

// ══════════════════════════════════════
//  VICTORY
// ══════════════════════════════════════
function showVictory() {
  setBuzzers(false);
  const sorted  = [...G.teams].sort((a,b) => b.score - a.score);
  const overlay = document.getElementById('victoryOverlay');
  overlay.classList.add('show');

  let stage = 0;

  function render(i) {
    const t = sorted[i];
    const m = MEDALS[Math.min(i, MEDALS.length-1)];
    const c = m.coms[Math.floor(Math.random() * m.coms.length)];
    const nameStyle = !m.cls ? `color:${t.color}` : '';
    overlay.innerHTML =
      `<div class="v-stage ${m.cls}">` +
      `<div class="v-comment">${c}</div>` +
      `<div class="v-place">${m.place}</div>` +
      `<div class="v-name" style="${nameStyle}">${t.name}</div>` +
      `<div class="v-score" style="color:${t.color}">${t.score} Punkte</div>` +
      (i === sorted.length-1 ? `<button class="vfinal-btn" onclick="doReset()">🔄 Neues Spiel</button>` : '') +
      `</div>`;
    playApplause();
    spawnConfetti(t.color, i === 0 ? 160 : 50, false);
  }

  render(0);
  const iv = setInterval(() => {
    stage++;
    if (stage >= sorted.length) { clearInterval(iv); return; }
    render(stage);
  }, 3000);
}

function doReset() {
  document.getElementById('victoryOverlay').classList.remove('show');
  G.usedSongs.clear();
  G.round   = 0;
  G.phase   = 'idle';
  G.teams.forEach(t => t.score = 0);
  showScreen('lobby');
}

// ══════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════
function playApplause() {
  try { new Audio('../chartster/applause.mp3').play().catch(()=>{}); } catch(e){}
}

// ══════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════
function spawnConfetti(color, count, wave) {
  const c    = document.getElementById('confetti');
  const cols = [color,'#fff','#ffd84d', COLORS[Math.floor(Math.random()*COLORS.length)]];
  for (let i = 0; i < count; i++) {
    const p   = document.createElement('div');
    const sz  = 5 + Math.random() * 12;
    const dur = 1.2 + Math.random() * 1.8;
    p.style.cssText =
      `position:absolute;top:-20px;left:${Math.random()*100}%;` +
      `width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};` +
      `border-radius:${['50%','3px','0'][i%3]};` +
      `transform:rotate(${Math.random()*360}deg);` +
      `animation:cf-fall ${dur}s ${Math.random()*.6}s linear both`;
    c.appendChild(p);
    setTimeout(() => p.remove(), Math.ceil((dur + 0.8) * 1000));
  }
  if (wave) setTimeout(() => spawnConfetti(color, Math.floor(count*.35), false), 750);
}

// ══════════════════════════════════════
//  HINT TOAST
// ══════════════════════════════════════
function showHint(msg) {
  const el = document.getElementById('hint-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
