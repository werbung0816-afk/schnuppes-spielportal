<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chartster Paparazzi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#53f6ff;--pink:#ff4fd8;--purple:#8f5fff;
  --bg:#07000f;--glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.10);
  --text:rgba(240,240,255,1);--muted:rgba(240,240,255,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Outfit',sans-serif;background:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 15% 40%,rgba(143,95,255,.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(83,246,255,.12) 0%,transparent 60%),
    radial-gradient(ellipse 45% 45% at 65% 85%,rgba(255,79,216,.12) 0%,transparent 60%);
  min-height:100vh;color:var(--text);overflow-x:hidden;
}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;padding:16px;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}

/* ── SHARED ── */
.card{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:24px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.sep{width:100%;height:1px;background:var(--glass-b)}
.game-title{font-size:40px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;align-self:flex-start}
.btn{width:100%;padding:16px;border-radius:14px;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;transition:all .2s;border:none;outline:none;touch-action:manipulation;cursor:pointer}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4)}

/* ── SEAT SELECTOR ── */
#table-selector{width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.ts-top-row,.ts-bot-row{display:flex;gap:32px;justify-content:center;padding:8px 0}
.ts-mid-row{display:flex;align-items:center;justify-content:center;width:100%;padding:4px 0}
#ts-table-body{width:220px;height:104px;flex:none;margin:0 8px;display:flex;align-items:center;justify-content:center;color:transparent;background:url(../chartster/icons/table.png) center/contain no-repeat;position:relative;filter:drop-shadow(0 4px 24px rgba(143,95,255,.5))}
.ts-side{display:flex;align-items:center;justify-content:center;padding:4px 0;flex:1}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px;cursor:pointer}
.seat-inp{width:92px;background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:6px 8px;color:var(--text);font-family:'Outfit',sans-serif;font-size:12px;outline:none;display:none;text-align:center}
.seat.active .seat-inp{display:block}
.ts-side .seat-inp{width:72px}
.seat-circle{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(83,246,255,.3);display:flex;align-items:center;justify-content:center;transition:all .25s;background:rgba(83,246,255,.04);position:relative;overflow:hidden;color:rgba(83,246,255,.4)}
.seat.active .seat-circle{border-style:solid;border-width:2.5px;color:#07000f}
.seat.active .seat-circle::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.18),transparent 70%)}

/* ── GOAL SELECTOR ── */
.goal-sel{display:flex;gap:8px;width:100%}
.goal-btn{flex:1;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:14px 8px;font-family:'Outfit',sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s;border:none;outline:none}
.goal-btn .gn{font-size:30px;font-weight:900;line-height:1}
.goal-btn .gl{font-size:11px}
.goal-btn.on{border:1px solid var(--pink);color:var(--pink);background:rgba(255,79,216,.08)}

/* ── HINT TOAST ── */
#hint-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,79,216,.18);border:1px solid rgba(255,79,216,.4);color:var(--pink);padding:11px 20px;border-radius:12px;font-size:16px;font-weight:600;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw}
#hint-toast.show{opacity:1}

/* ── CONFETTI ── */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:700;overflow:hidden}
@keyframes cf-fall{0%{opacity:1;transform:translateY(-20px) rotate(0deg)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}

/* ── SCOREBOARD ── */
.scoreboard{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1000px}
.s-chip{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-b);border-radius:40px;padding:7px 14px;font-size:14px;font-weight:600;transition:all .25s}
.s-chip.cur{border-width:2px}
.s-chip .sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.s-chip .spts{font-size:17px;font-weight:900;min-width:22px;text-align:center}
.goal-pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .3s}
.goal-pip.filled{background:gold;box-shadow:0 0 5px gold}
.goal-bar{display:flex;gap:3px;margin-left:2px}

/* ── GAME SCREEN ── */
#screen-game{justify-content:flex-start;padding:10px;gap:8px;align-items:center}

/* ── GAME LAYOUT ──
   Grid: team-name labels outside, buzzers at image edge
   
   Layout:
   [top-name-l] [top-buzz-l] [IMAGE+SOLUTION] [top-buzz-r] [top-name-r]
   [left-name]  [left-buzz]                   [right-buzz] [right-name]
   [bot-name-l] [bot-buzz-l]                  [bot-buzz-r] [bot-name-r]
*/
.game-area{
  position:relative;
  width:100%;
  max-width:960px;
  display:grid;
  grid-template-columns: auto auto 1fr auto auto;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "tl-name tl-buzz center tr-buzz tr-name"
    "l-name  l-buzz  center r-buzz  r-name"
    "bl-name bl-buzz center br-buzz br-name";
  gap:0;
  align-items:center;
}

/* image+solution center */
.center-wrap{
  grid-area:center;
  display:flex;
  align-items:stretch;
  width:100%;
}

/* reveal image */
.reveal-wrap{
  position:relative;
  flex:1;
  min-width:0;
  aspect-ratio:1/1;
  border-radius:20px;
  overflow:hidden;
  border:2px solid var(--glass-b);
}
.reveal-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  transition:filter .6s ease, transform .6s ease;
  border-radius:18px;
}
.reveal-progress{position:absolute;bottom:0;left:0;width:100%;height:4px;background:rgba(255,255,255,.1);z-index:10}
.reveal-progress-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s ease;width:0%}

/* solution panel — right of image */
.solution-panel{
  width:160px;flex-shrink:0;
  background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--glass-b);border-left:none;
  border-radius:0 14px 14px 0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;padding:16px 12px;text-align:center;
}
.solution-panel.show{display:flex}
.sol-artist{font-size:clamp(22px,3.5vw,38px);font-weight:900;line-height:1.15;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sol-followers{font-size:12px;color:var(--muted);font-weight:600}
.sol-result{font-size:14px;font-weight:800;padding:6px 12px;border-radius:8px}
.sol-result.correct{color:#00c853;background:rgba(0,200,83,.12);border:1px solid rgba(0,200,83,.3)}
.sol-result.wrong{color:#ff4b4b;background:rgba(200,0,0,.12);border:1px solid rgba(200,0,0,.3)}
.sol-next{padding:12px 20px;border-radius:12px;border:none;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;width:100%}

/* judge panel — also right of image, overlaps solution */
.judge-panel{
  width:160px;flex-shrink:0;
  background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--glass-b);border-left:none;
  border-radius:0 14px 14px 0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;padding:14px 12px;text-align:center;
}
.judge-panel.show{display:flex}
.judge-who{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.judge-name{font-size:18px;font-weight:900}
.btn-reveal{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(83,246,255,.4);font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:rgba(83,246,255,.08);color:var(--cyan)}
#judge-btns{display:none;width:100%;flex-direction:column;gap:8px}
.btn-correct{width:100%;padding:11px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#00c853,#00962f);color:#fff}
.btn-wrong{width:100%;padding:11px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#e60000,#8b0000);color:#fff}

/* ── BUZZER CELLS ── */
/* top row */
.buzz-cell-tl{grid-area:tl-buzz;display:flex;justify-content:flex-end;align-items:flex-end;padding-bottom:4px}
.buzz-cell-tr{grid-area:tr-buzz;display:flex;justify-content:flex-start;align-items:flex-end;padding-bottom:4px}
/* mid row */
.buzz-cell-l{grid-area:l-buzz;display:flex;justify-content:flex-end;align-items:center;padding-right:4px}
.buzz-cell-r{grid-area:r-buzz;display:flex;justify-content:flex-start;align-items:center;padding-left:4px}
/* bot row */
.buzz-cell-bl{grid-area:bl-buzz;display:flex;justify-content:flex-end;align-items:flex-start;padding-top:4px}
.buzz-cell-br{grid-area:br-buzz;display:flex;justify-content:flex-start;align-items:flex-start;padding-top:4px}

/* ── NAME CELLS ── */
.name-cell{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
/* top names: upside down */
.name-cell-tl{grid-area:tl-name;transform:rotate(180deg);align-self:end;padding-bottom:4px;text-align:right}
.name-cell-tr{grid-area:tr-name;transform:rotate(180deg);align-self:end;padding-bottom:4px;text-align:left}
/* left name: rotated */
.name-cell-l{grid-area:l-name;transform:rotate(-90deg);align-self:center}
/* right name */
.name-cell-r{grid-area:r-name;transform:rotate(90deg);align-self:center}
/* bot names: normal */
.name-cell-bl{grid-area:bl-name;align-self:start;padding-top:4px;text-align:right}
.name-cell-br{grid-area:br-name;align-self:start;padding-top:4px;text-align:left}

/* ── 3D BUZZER ── */
.buzzer-btn{
  width:clamp(56px,10vw,80px);
  height:clamp(56px,10vw,80px);
  border-radius:50%;cursor:pointer;
  position:relative;border:none;outline:none;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:transform .1s;flex-shrink:0;
}
.buzzer-btn:active{transform:scale(.9)!important}
.buzzer-btn.buzzed-out{opacity:.25;pointer-events:none}
.tbz-outer{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#888 0%,#333 40%,#111 100%);box-shadow:0 4px 16px rgba(0,0,0,.7),inset 0 2px 3px rgba(255,255,255,.12)}
.tbz-dome{position:absolute;inset:10%;border-radius:50%;box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),inset 0 3px 7px rgba(255,255,255,.2),0 3px 12px var(--tcol,#fff)}
.tbz-shine{position:absolute;top:14%;left:21%;width:28%;height:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,transparent 70%);pointer-events:none}
/* pulse when game active */
.game-active .tbz-dome{animation:dome-pulse 1.8s ease-in-out infinite}
@keyframes dome-pulse{
  0%,100%{box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),inset 0 3px 7px rgba(255,255,255,.2),0 3px 12px var(--tcol),0 0 18px var(--tcol)}
  50%{box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),inset 0 3px 7px rgba(255,255,255,.2),0 3px 20px var(--tcol),0 0 36px var(--tcol)}
}

/* ── VICTORY ── */
#victoryOverlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.93);backdrop-filter:blur(14px);z-index:999;padding:24px;flex-direction:column}
#victoryOverlay.show{display:flex}
@keyframes zoomIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.vc-inner{animation:zoomIn .5s ease;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:440px}
.vc-title{font-size:clamp(32px,9vw,58px);font-weight:900;text-align:center;background:linear-gradient(135deg,gold,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vc-scores{display:flex;flex-direction:column;gap:10px;width:100%}
.vc-row{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:13px 18px}
.vc-row.winner{border-color:gold;background:rgba(255,215,0,.07);box-shadow:0 0 24px rgba(255,215,0,.15)}
.vc-medal{font-size:22px;width:30px;text-align:center}
.vc-name{flex:1;font-size:16px;font-weight:700}
.vc-pts{font-size:22px;font-weight:900}
.vc-pts small{font-size:11px;font-weight:400;color:var(--muted)}
.vfinal-btn{padding:16px 40px;border:none;border-radius:14px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));font-family:'Outfit',sans-serif;cursor:pointer}
.ver{position:fixed;bottom:12px;right:16px;font-size:11px;font-weight:700;color:rgba(255,255,255,.3);z-index:100}
</style>
</head>
<body>
<div id="hint-toast"></div>
<div id="confetti"></div>
<div id="victoryOverlay"></div>
<div class="ver">v1.4.0</div>

<!-- ════ LOBBY ════ -->
<div id="screen-lobby" class="screen active">
<div class="card">
  <div class="game-title">PAPARAZZI</div>
  <div style="font-size:13px;color:var(--muted);margin-top:-8px">Erkenne den Künstler aus dem verschwommenen Bild</div>
  <div class="sep"></div>
  <div id="table-selector">
    <div class="ts-top-row">
      <div class="seat" data-pos="top-l" onclick="toggleSeat('top-l')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
      <div class="seat" data-pos="top-r" onclick="toggleSeat('top-r')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
    </div>
    <div class="ts-mid-row">
      <div class="ts-side"><div class="seat" data-pos="left" onclick="toggleSeat('left')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()"></div></div>
      <div id="ts-table-body"></div>
      <div class="ts-side"><div class="seat" data-pos="right" onclick="toggleSeat('right')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()"></div></div>
    </div>
    <div class="ts-bot-row">
      <div class="seat" data-pos="bot-l" onclick="toggleSeat('bot-l')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
      <div class="seat" data-pos="bot-r" onclick="toggleSeat('bot-r')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
    </div>
  </div>
  <div class="sep"></div>
  <div class="label">🏆 Gewinnpunkte</div>
  <div class="goal-sel">
    <button class="goal-btn" data-g="3" onclick="setGoal(this)"><span class="gn">3</span><span class="gl">Punkte</span></button>
    <button class="goal-btn on" data-g="5" onclick="setGoal(this)"><span class="gn">5</span><span class="gl">Punkte</span></button>
    <button class="goal-btn" data-g="7" onclick="setGoal(this)"><span class="gn">7</span><span class="gl">Punkte</span></button>
  </div>
  <div class="sep"></div>
  <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>Spiel starten</button>
  <div id="lobby-status" style="font-size:13px;color:var(--muted);text-align:center;min-height:18px"></div>
</div>
</div>

<!-- ════ GAME ════ -->
<div id="screen-game" class="screen">
  <div class="scoreboard" id="scoreboard"></div>
  <div class="game-area" id="game-area">
    <!-- name + buzz cells filled by JS -->
    <div class="buzz-cell-tl" id="cell-tl-buzz"></div>
    <div class="buzz-cell-tr" id="cell-tr-buzz"></div>
    <div class="buzz-cell-l"  id="cell-l-buzz"></div>
    <div class="buzz-cell-r"  id="cell-r-buzz"></div>
    <div class="buzz-cell-bl" id="cell-bl-buzz"></div>
    <div class="buzz-cell-br" id="cell-br-buzz"></div>
    <div class="name-cell name-cell-tl" id="cell-tl-name"></div>
    <div class="name-cell name-cell-tr" id="cell-tr-name"></div>
    <div class="name-cell name-cell-l"  id="cell-l-name"></div>
    <div class="name-cell name-cell-r"  id="cell-r-name"></div>
    <div class="name-cell name-cell-bl" id="cell-bl-name"></div>
    <div class="name-cell name-cell-br" id="cell-br-name"></div>
    <!-- center -->
    <div class="center-wrap">
      <div class="reveal-wrap" id="reveal-wrap">
        <div class="reveal-progress"><div class="reveal-progress-bar" id="progress-bar"></div></div>
      </div>
      <!-- judge panel -->
      <div class="judge-panel" id="judge-panel">
        <div class="judge-who">Gebuzzert:</div>
        <div class="judge-name" id="judge-name"></div>
        <button class="btn-reveal" id="btn-reveal" onclick="revealNow()">🔍 Auflösen</button>
        <div id="judge-btns">
          <button class="btn-correct" onclick="judge(true)">✓ Richtig</button>
          <button class="btn-wrong"   onclick="judge(false)">✗ Falsch</button>
        </div>
      </div>
      <!-- solution panel -->
      <div class="solution-panel" id="solution-panel">
        <div id="sol-result-badge" class="sol-result"></div>
        <div class="sol-artist" id="sol-artist"></div>
        <div class="sol-followers" id="sol-followers"></div>
        <button class="sol-next" onclick="nextArtist()">Weiter ▶</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════ CONFIG ════
var COLORS=['#53f6ff','#ff4fd8','#8f5fff','#4dff91','#ff9f1c','#e0ff4f'];
var DEFAULTS=['Helden','Legenden','Stars','Cracks','Profis','Champs'];
var MAX_TEAMS=6;
var SEAT_POS=['top-l','top-r','left','right','bot-l','bot-r'];
var CW_ORDER=['top-l','top-r','right','bot-r','bot-l','left'];
var SEAT_SIDE={'top-l':'top','top-r':'top','left':'left','right':'right','bot-l':'bot','bot-r':'bot'};
// pos → which grid cell
var POS_TO_CELL={
  'top-l':'tl','top-r':'tr','left':'l','right':'r','bot-l':'bl','bot-r':'br'
};
var BLUR_STEPS=[20,16,13,10,8,6,1,0];
var STEP_INTERVAL=1600;

// ════ STATE ════
var seatCfg={'top-l':null,'top-r':null,'left':null,'right':null,'bot-l':null,'bot-r':null};
var G={
  artists:[],goal:5,
  teams:[],players:[],scores:[],
  queue:[],cur:null,revealImg:null,
  stepIdx:0,stepTimer:null,
  buzzedPlayer:-1,buzzedOut:[],running:false,
  startSeatIdx:0,imgRotDeg:0
};

// ════ BOOT ════
loadSongs();

function loadSongs(){
  document.getElementById('lobby-status').textContent='lädt …';
  fetch('../chartster/songs.json')
    .then(function(r){return r.ok?r.json():Promise.reject(r.status);})
    .then(function(data){
      var all=Array.isArray(data)?data:(data.songs||[]);
      var artistMap={};
      all.forEach(function(s){
        var key=(s.a||''). trim().toLowerCase();
        if(!key)return;
        var hasImg=!!(s.ca&&s.ca.trim());
        var inTop20=s.p&&s.p<=20;
        if(!artistMap[key]){artistMap[key]={name:(s.a||'').trim(),img:hasImg?s.ca:null,followers:s.fo||0,inTop20:!!inTop20};}
        else{
          if(hasImg&&!artistMap[key].img)artistMap[key].img=s.ca;
          if(inTop20)artistMap[key].inTop20=true;
          if((s.fo||0)>artistMap[key].followers)artistMap[key].followers=s.fo||0;
        }
      });
      var pool=Object.values(artistMap).filter(function(a){return!!a.img&&a.inTop20;});
      G.artists=shuffle(pool);
      if(!G.artists.length){
        document.getElementById('lobby-status').textContent='⚠ Keine Künstlerbilder — bitte spotify_link_fetcher.py ausführen';
        return;
      }
      document.getElementById('lobby-status').textContent=G.artists.length+' Künstler verfügbar';
      updateStartBtn();
    })
    .catch(function(){document.getElementById('lobby-status').textContent='⚠ songs.json nicht gefunden';});
}

// ════ SEAT SELECTOR ════
function toggleSeat(pos){
  var seat=document.querySelector('.seat[data-pos="'+pos+'"]');
  if(seatCfg[pos]){
    seatCfg[pos]=null;seat.classList.remove('active');
    seat.querySelector('.seat-circle').style.cssText='';
    var inp=seat.querySelector('.seat-inp');inp.value='';inp.style.display='none';
    reassignColors();
  } else {
    var active=getActiveSeats();
    if(active.length>=MAX_TEAMS){showHint('Maximal '+MAX_TEAMS+' Teams!');return;}
    var ci=active.length;
    seatCfg[pos]={name:'',colorIdx:ci};
    seat.classList.add('active');
    var circ=seat.querySelector('.seat-circle');
    circ.style.background=COLORS[ci];circ.style.borderColor=COLORS[ci];circ.style.borderStyle='solid';
    circ.textContent=DEFAULTS[ci].substring(0,2);
    var inp=seat.querySelector('.seat-inp');inp.style.display='block';inp.placeholder=DEFAULTS[ci];
  }
  updateStartBtn();
}
function reassignColors(){
  getActiveSeats().forEach(function(pos,i){
    seatCfg[pos].colorIdx=i;
    var circ=document.querySelector('.seat[data-pos="'+pos+'"] .seat-circle');
    circ.style.background=COLORS[i];circ.style.borderColor=COLORS[i];
    document.querySelector('.seat[data-pos="'+pos+'"] .seat-inp').placeholder=DEFAULTS[i];
  });
}
function getActiveSeats(){return SEAT_POS.filter(function(p){return seatCfg[p]!==null;});}
function updateStartBtn(){document.getElementById('start-btn').disabled=getActiveSeats().length<2||!G.artists.length;}
function setGoal(btn){document.querySelectorAll('.goal-btn').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');G.goal=parseInt(btn.dataset.g);}

// ════ START ════
function startGame(){
  var active=getActiveSeats();
  if(active.length<2){showHint('Mindestens 2 Teams!');return;}
  if(!G.artists.length){showHint('Songs laden…');return;}
  G.teams=active.map(function(pos,i){
    var inp=document.querySelector('.seat[data-pos="'+pos+'"] .seat-inp');
    return{name:inp&&inp.value.trim()?inp.value.trim():DEFAULTS[i],color:COLORS[i],pos:pos,side:SEAT_SIDE[pos]};
  });
  G.players=G.teams.map(function(t){return t.name;});
  G.scores=G.teams.map(function(){return 0;});
  G.queue=shuffle(G.artists.map(function(_,i){return i;}));
  G.startSeatIdx=0;
  renderScoreboard();
  buildBuzzers();
  document.getElementById('screen-game').classList.add('game-active');
  showScreen('game');
  nextArtist();
}

// ════ SCOREBOARD ════
function renderScoreboard(){
  var sb=document.getElementById('scoreboard');sb.innerHTML='';
  G.teams.forEach(function(team,i){
    var pips='';
    for(var p=0;p<G.goal;p++)pips+='<div class="goal-pip'+(p<G.scores[i]?' filled':'')+'" id="pip-'+i+'-'+p+'"></div>';
    var chip=document.createElement('div');chip.className='s-chip';chip.id='chip-'+i;
    chip.innerHTML='<div class="sdot" style="background:'+team.color+';box-shadow:0 0 6px '+team.color+'"></div>'+
      '<span>'+esc(team.name)+'</span>'+
      '<span class="spts" id="pts-'+i+'" style="color:'+team.color+'">'+G.scores[i]+'</span>'+
      '<div class="goal-bar">'+pips+'</div>';
    sb.appendChild(chip);
  });
}
function updateScoreboard(){
  G.teams.forEach(function(_,i){
    document.getElementById('pts-'+i).textContent=G.scores[i];
    for(var p=0;p<G.goal;p++){
      var pip=document.getElementById('pip-'+i+'-'+p);
      if(pip)pip.className='goal-pip'+(p<Math.max(0,G.scores[i])?' filled':'');
    }
  });
}

// ════ BUILD BUZZERS ════
// Clockwise rotation: each round, startSeatIdx advances by 1
// Teams stay at their FIXED positions — only the image rotates
function buildBuzzers(){
  // Clear all cells
  ['tl','tr','l','r','bl','br'].forEach(function(c){
    document.getElementById('cell-'+c+'-buzz').innerHTML='';
    document.getElementById('cell-'+c+'-name').textContent='';
    document.getElementById('cell-'+c+'-name').style.color='';
  });
  G.teams.forEach(function(team,i){
    var cell=POS_TO_CELL[team.pos];
    // Buzzer
    var btn=document.createElement('button');
    btn.className='buzzer-btn';btn.id='buzz-btn-'+i;
    btn.style.setProperty('--tcol',team.color);
    btn.innerHTML='<div class="tbz-outer"></div>'+
      '<div class="tbz-dome" style="background:radial-gradient(circle at 38% 28%,'+lighten(team.color)+' 0%,'+team.color+' 40%,'+darken(team.color)+' 100%)"></div>'+
      '<div class="tbz-shine"></div>';
    btn.ontouchstart=function(e){e.preventDefault();onBuzz(i);};
    btn.onclick=function(){onBuzz(i);};
    document.getElementById('cell-'+cell+'-buzz').appendChild(btn);
    // Name label
    var nameEl=document.getElementById('cell-'+cell+'-name');
    nameEl.textContent=team.name.toUpperCase();
    nameEl.style.color=team.color;
  });
}

// ════ IMAGE ROTATION ════
function rotateImageForRound(){
  // Determine which team starts this round
  var cwActive=CW_ORDER.filter(function(pos){return G.teams.some(function(t){return t.pos===pos;});});
  if(!cwActive.length)return;
  var startPos=cwActive[G.startSeatIdx%cwActive.length];
  var side=SEAT_SIDE[startPos]||'bot';
  var deg={bot:0,left:90,top:180,right:270}[side]||0;
  G.imgRotDeg=deg;
  applyImgTransform();
}
function applyImgTransform(){
  if(!G.revealImg)return;
  var deg=G.imgRotDeg;
  var scale=(deg===90||deg===270)?0.88:1;
  G.revealImg.style.transform='rotate('+deg+'deg) scale('+scale+')';
}

// ════ NEXT ARTIST ════
function nextArtist(){
  document.getElementById('judge-panel').classList.remove('show');
  document.getElementById('solution-panel').classList.remove('show');
  // Re-enable buzzers
  document.querySelectorAll('.buzzer-btn').forEach(function(b){
    b.classList.remove('buzzed-out');b.style.pointerEvents='';b.style.opacity='1';
    b.style.transform='';
    var d=b.querySelector('.tbz-dome');if(d)d.style.boxShadow='';
  });
  if(!G.queue.length)G.queue=shuffle(G.artists.map(function(_,i){return i;}));
  var idx=G.queue.pop();
  G.cur=G.artists[idx];
  G.stepIdx=0;G.buzzedPlayer=-1;G.buzzedOut=[];G.running=true;
  document.getElementById('progress-bar').style.width='0%';
  // Load image
  var wrap=document.getElementById('reveal-wrap');
  if(G.revealImg){G.revealImg.remove();G.revealImg=null;}
  var img=new Image();
  img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .6s ease,transform .6s ease;border-radius:18px;';
  img.style.filter='blur(20px)';
  img.onload=function(){G.revealImg=img;applyImgTransform();scheduleNext();};
  img.onerror=function(){nextArtist();};
  img.src=G.cur.img;
  wrap.appendChild(img);
  // Rotate for this round
  rotateImageForRound();
}

// ════ BLUR REVEAL ════
function drawStep(idx){
  var blur=BLUR_STEPS[Math.min(idx,BLUR_STEPS.length-1)];
  if(G.revealImg){
    G.revealImg.style.filter=blur>0?'blur('+blur+'px)':'none';
    applyImgTransform();
  }
}
function scheduleNext(){
  clearTimeout(G.stepTimer);
  if(!G.running)return;
  G.stepTimer=setTimeout(function(){
    if(!G.running)return;
    G.stepIdx++;
    if(G.stepIdx>=BLUR_STEPS.length){G.running=false;showSolution('timeout');return;}
    drawStep(G.stepIdx);
    document.getElementById('progress-bar').style.width=Math.round((G.stepIdx/(BLUR_STEPS.length-1))*100)+'%';
    scheduleNext();
  },STEP_INTERVAL);
}

// ════ BUZZ ════
function onBuzz(playerIdx){
  if(!G.running)return;
  if(G.buzzedOut.includes(playerIdx))return;
  clearTimeout(G.stepTimer);G.running=false;
  G.buzzedPlayer=playerIdx;
  // Dim all, highlight buzzer
  document.querySelectorAll('.buzzer-btn').forEach(function(b){b.style.pointerEvents='none';b.style.opacity='.3';});
  var bb=document.getElementById('buzz-btn-'+playerIdx);
  if(bb){bb.style.opacity='1';bb.style.transform='scale(1.12)';var d=bb.querySelector('.tbz-dome');if(d)d.style.boxShadow='0 0 28px 6px '+G.teams[playerIdx].color;}
  // Show judge panel
  document.getElementById('judge-name').innerHTML='<span style="color:'+G.teams[playerIdx].color+'">'+esc(G.teams[playerIdx].name)+'</span>';
  document.getElementById('judge-btns').style.display='none';
  document.getElementById('btn-reveal').style.display='block';
  document.getElementById('solution-panel').classList.remove('show');
  document.getElementById('judge-panel').classList.add('show');
}

function revealNow(){
  drawStep(BLUR_STEPS.length-1);
  document.getElementById('progress-bar').style.width='100%';
  document.getElementById('btn-reveal').style.display='none';
  document.getElementById('judge-btns').style.display='flex';
}

function judge(correct){
  var pi=G.buzzedPlayer;
  document.getElementById('judge-panel').classList.remove('show');
  if(correct){
    G.scores[pi]++;updateScoreboard();
    spawnConfetti(G.teams[pi].color,50);
    showSolution('correct');
    if(G.scores[pi]>=G.goal)setTimeout(showVictory,1800);
  } else {
    G.scores[pi]=Math.max(-99,G.scores[pi]-1);updateScoreboard();
    showSolution('wrong');
  }
}

function showSolution(type){
  G.running=false;clearTimeout(G.stepTimer);
  drawStep(BLUR_STEPS.length-1);
  document.getElementById('progress-bar').style.width='100%';
  document.querySelectorAll('.buzzer-btn').forEach(function(b){b.style.pointerEvents='none';b.style.opacity='.25';});
  var badge=document.getElementById('sol-result-badge');
  if(type==='correct'){badge.className='sol-result correct';badge.textContent='✓ Richtig! +1';}
  else if(type==='wrong'){badge.className='sol-result wrong';badge.textContent='✗ Falsch! −1';}
  else{badge.className='';badge.textContent='';}
  document.getElementById('sol-artist').textContent=G.cur.name;
  var fol=G.cur.followers;
  document.getElementById('sol-followers').textContent=fol?formatFollowers(fol)+' Follower':'';
  document.getElementById('solution-panel').classList.add('show');
  // Advance rotation for next round
  G.startSeatIdx=(G.startSeatIdx+1)%Math.max(1,G.teams.length);
}

// ════ VICTORY ════
function showVictory(){
  var ranked=G.teams.map(function(t,i){return{name:t.name,score:G.scores[i],color:t.color};}).sort(function(a,b){return b.score-a.score;});
  var medals=['🥇','🥈','🥉','🏅'];
  document.getElementById('victoryOverlay').innerHTML='<div class="vc-inner">'+
    '<div class="vc-title">🏆 '+esc(ranked[0].name)+' gewinnt!</div>'+
    '<div class="vc-scores">'+ranked.map(function(p,i){return'<div class="vc-row'+(i===0?' winner':'')+'">'+
      '<span class="vc-medal">'+medals[i]+'</span><span class="vc-name">'+esc(p.name)+'</span>'+
      '<span class="vc-pts" style="color:'+(i===0?'gold':p.color)+'">'+p.score+'<small> Pt'+(p.score!==1?'s':'')+'</small></span></div>';}).join('')+'</div>'+
    '<button class="vfinal-btn" onclick="resetToLobby()">🔄 Nochmal spielen</button></div>';
  document.getElementById('victoryOverlay').classList.add('show');
  spawnConfetti(G.teams[0].color,140);
}
function resetToLobby(){
  clearTimeout(G.stepTimer);G.running=false;
  document.getElementById('victoryOverlay').classList.remove('show');
  document.getElementById('screen-game').classList.remove('game-active');
  showScreen('lobby');
}

// ════ UTILS ════
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function showScreen(n){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById('screen-'+n).classList.add('active');}
function showHint(msg){var el=document.getElementById('hint-toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},3000);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatFollowers(n){if(n>=1000000)return(n/1000000).toFixed(1).replace('.',',')+' Mio.';if(n>=1000)return(n/1000).toFixed(0)+' Tsd.';return n+'';}
function hexToRgb(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b];}
function lighten(h){try{var c=hexToRgb(h);return'rgb('+Math.min(255,c[0]+80)+','+Math.min(255,c[1]+80)+','+Math.min(255,c[2]+80)+')'; }catch(e){return h;}}
function darken(h){try{var c=hexToRgb(h);return'rgb('+Math.max(0,c[0]-80)+','+Math.max(0,c[1]-80)+','+Math.max(0,c[2]-80)+')'; }catch(e){return h;}}
function spawnConfetti(color,count){
  var c=document.getElementById('confetti');
  var cols=[color,'#fff','#ffd84d',COLORS[Math.floor(Math.random()*COLORS.length)]];
  for(var i=0;i<count;i++){
    var p=document.createElement('div');var sz=5+Math.random()*12;var dur=1.2+Math.random()*1.8;
    p.style.cssText='position:absolute;top:-20px;left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';border-radius:'+(i%3===0?'50%':i%3===1?'3px':'0')+';transform:rotate('+Math.random()*360+'deg);animation:cf-fall '+dur+'s '+Math.random()*.6+'s linear both';
    c.appendChild(p);setTimeout(function(el){el.remove();},(dur+1)*1000,p);
  }
}
</script>
</body>
