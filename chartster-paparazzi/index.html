<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chartster Paparazzi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS (1:1 Chartster) ── */
:root{
  --cyan:#53f6ff;--pink:#ff4fd8;--purple:#8f5fff;
  --bg:#07000f;--glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.10);
  --text:rgba(240,240,255,1);--muted:rgba(240,240,255,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 15% 40%,rgba(143,95,255,.18) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(83,246,255,.12) 0%,transparent 60%),
    radial-gradient(ellipse 45% 45% at 65% 85%,rgba(255,79,216,.12) 0%,transparent 60%);
  min-height:100vh;color:var(--text);overflow-x:hidden;
}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;padding:16px;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}

/* ── SHARED ── */
.card{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:24px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.sep{width:100%;height:1px;background:var(--glass-b)}
.game-title{font-size:40px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(83,246,255,.4))}
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;align-self:flex-start}
.btn{width:100%;padding:16px;border-radius:14px;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;transition:all .2s;border:none;outline:none;touch-action:manipulation;user-select:none;cursor:pointer}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));color:var(--cyan);border:1px solid rgba(83,246,255,.4)}
.btn-secondary{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--glass-b)}

/* ── PLAYER ROWS ── */
.player-rows{display:flex;flex-direction:column;gap:8px;width:100%}
.player-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);border-radius:12px;padding:10px 14px;transition:border-color .2s}
.player-row:focus-within{border-color:var(--purple);box-shadow:0 0 0 2px rgba(143,95,255,.15)}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.player-row input{background:transparent;border:none;outline:none;color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;width:100%}
.player-row input::placeholder{color:var(--muted)}

/* ── GOAL SELECTOR ── */
.goal-sel{display:flex;gap:8px;width:100%}
.goal-btn{flex:1;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:14px 8px;font-family:'Outfit',sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s;border:none}
.goal-btn .gn{font-size:30px;font-weight:900;line-height:1}
.goal-btn .gl{font-size:11px;letter-spacing:.04em}
.goal-btn.on{border:1px solid var(--pink);color:var(--pink);background:rgba(255,79,216,.08)}

/* ── HINT TOAST ── */
#hint-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,79,216,.18);border:1px solid rgba(255,79,216,.4);color:var(--pink);padding:11px 20px;border-radius:12px;font-size:16px;font-weight:600;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw}
#hint-toast.show{opacity:1}

/* ── CONFETTI ── */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:700;overflow:hidden}
@keyframes cf-fall{0%{opacity:1;transform:translateY(-20px) rotate(0deg)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}

/* ── SCOREBOARD ── */
.scoreboard{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}
.s-chip{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-b);border-radius:40px;padding:7px 14px;font-size:14px;font-weight:600;transition:all .25s;position:relative}
.s-chip.cur{border-width:2px}
.s-chip .sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.s-chip .spts{font-size:17px;font-weight:900;min-width:22px;text-align:center}
.s-chip .goal-bar{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.goal-pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .3s}
.goal-pip.filled{background:gold;box-shadow:0 0 5px gold}

/* ── GAME SCREEN ── */
#screen-game{justify-content:flex-start;padding:12px 12px 32px;gap:12px}
.game-row{display:flex;gap:12px;width:100%;max-width:900px;align-items:flex-start}
.game-right{display:flex;flex-direction:column;gap:12px;width:160px;flex-shrink:0}

/* ── PIXELATION CANVAS ── */
.reveal-wrap{
  position:relative;
  flex:1;
  min-width:0;
  aspect-ratio:1/1;
  border-radius:20px;
  overflow:hidden;
  border:2px solid var(--glass-b);
  flex-shrink:0;
}
#reveal-canvas{
  width:100%;height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  display:block;
}

/* progress bar */
.reveal-progress{
  position:absolute;bottom:0;left:0;width:100%;height:4px;
  background:rgba(255,255,255,.1);
  z-index:10;
}
.reveal-progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  transition:width .4s ease;
  width:0%;
}

/* ── BUZZER ── */
.buzzer-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
}

.buzzer{
  width:clamp(90px,22vw,130px);
  height:clamp(90px,22vw,130px);
  border-radius:50%;
  cursor:pointer;
  position:relative;
  border:none;
  outline:none;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:transform .1s;
}
.buzzer:active{transform:scale(.93)!important}

/* base shadow/glow ring */
.buzzer::before{
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(200,0,0,.5) 0%,transparent 70%);
  animation:buzzer-pulse 1.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes buzzer-pulse{
  0%,100%{opacity:.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.12)}
}

/* outer metal ring */
.buzzer-outer{
  position:absolute;
  inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #888 0%, #333 40%, #111 100%);
  box-shadow:
    0 6px 24px rgba(0,0,0,.8),
    0 2px 6px rgba(0,0,0,.9),
    inset 0 2px 4px rgba(255,255,255,.15),
    inset 0 -3px 6px rgba(0,0,0,.6);
}

/* red dome */
.buzzer-dome{
  position:absolute;
  inset:10%;
  border-radius:50%;
  background:radial-gradient(circle at 38% 28%,
    #ff6b6b 0%,
    #e60000 35%,
    #9b0000 70%,
    #5a0000 100%
  );
  box-shadow:
    inset 0 -4px 12px rgba(0,0,0,.6),
    inset 0 4px 10px rgba(255,180,180,.25),
    0 4px 16px rgba(200,0,0,.6),
    0 0 40px rgba(220,0,0,.35);
}

/* specular highlight */
.buzzer-shine{
  position:absolute;
  top:13%;left:20%;
  width:30%;height:20%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.6) 0%,transparent 70%);
  pointer-events:none;
}

/* BUZZER label */
.buzzer-label{
  position:absolute;
  bottom:-28px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:700;color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;
  white-space:nowrap;
}

/* ── BUZZER STATES ── */
.buzzer.inactive{pointer-events:none;opacity:.35}
.buzzer.inactive::before{animation:none}

/* ── BOTTOM PANEL (unified, inside img-rotate-wrap) ── */
#bottom-panel{
  position:absolute;left:0;right:0;bottom:0;top:auto;
  background:linear-gradient(to bottom,transparent 0%,rgba(7,0,15,.75) 28%,rgba(7,0,15,.94) 55%);
  padding:56px 18px 16px;
  display:none;
  flex-direction:column;align-items:center;gap:10px;
  text-align:center;z-index:20;
}
#bottom-panel.show{display:flex}
/* sub-states */
#bp-waiting,#bp-buzzed,#bp-judging,#bp-timeout{
  display:none;flex-direction:column;align-items:center;gap:8px;width:100%;
}
#bp-waiting.on,#bp-buzzed.on,#bp-judging.on,#bp-timeout.on{display:flex}
/* team name when buzzed */
.bp-team{font-size:clamp(20px,4vw,28px);font-weight:900}
.bp-sub{font-size:13px;color:rgba(240,240,255,.65);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
/* artist name when judging / timeout */
.bp-artist{
  font-size:clamp(22px,4.5vw,40px);font-weight:900;line-height:1.1;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 10px rgba(83,246,255,.4));
}
/* button row */
.bp-row{display:flex;gap:10px;width:100%}
/* buttons */
.bp-btn{
  flex:1;padding:12px 16px;border-radius:12px;border:none;
  font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;cursor:pointer;
}
.bp-start{
  padding:13px 40px;border-radius:12px;border:none;
  font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;
  box-shadow:0 4px 18px rgba(83,246,255,.3);
}
.bp-action{
  padding:12px 32px;border-radius:12px;border:none;
  font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,rgba(83,246,255,.15),rgba(143,95,255,.15));
  color:var(--cyan);border:1px solid rgba(83,246,255,.4);
}
.bp-correct{background:linear-gradient(135deg,#00c853,#00962f);color:#fff;box-shadow:0 3px 12px rgba(0,200,83,.35)}
.bp-wrong  {background:linear-gradient(135deg,#e60000,#8b0000);color:#fff;box-shadow:0 3px 12px rgba(200,0,0,.35)}
.bp-next{
  padding:12px 32px;border-radius:12px;border:none;
  font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;
}

/* ── VICTORY OVERLAY ── */
#victoryOverlay{
  position:fixed;inset:0;display:none;
  justify-content:center;align-items:center;
  background:rgba(0,0,0,.93);backdrop-filter:blur(14px);
  z-index:999;padding:24px;flex-direction:column;
}
#victoryOverlay.show{display:flex}
@keyframes zoomIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.vc-inner{animation:zoomIn .5s ease;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:440px}
.vc-title{font-size:clamp(32px,9vw,58px);font-weight:900;text-align:center;
  background:linear-gradient(135deg,gold,var(--pink),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vc-scores{display:flex;flex-direction:column;gap:10px;width:100%}
.vc-row{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:13px 18px}
.vc-row.winner{border-color:gold;background:rgba(255,215,0,.07);box-shadow:0 0 24px rgba(255,215,0,.15)}
.vc-medal{font-size:22px;width:30px;text-align:center}
.vc-name{flex:1;font-size:16px;font-weight:700}
.vc-pts{font-size:22px;font-weight:900}
.vc-pts small{font-size:11px;font-weight:400;color:var(--muted)}
.vfinal-btn{padding:16px 40px;border:none;border-radius:14px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));font-family:'Outfit',sans-serif;cursor:pointer}


/* ── SEAT SELECTOR (from Chartster) ── */
#table-selector{width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.ts-top-row,.ts-bot-row{display:flex;gap:32px;justify-content:center;padding:8px 0}
.ts-mid-row{display:flex;align-items:center;justify-content:center;width:100%;padding:4px 0}
#ts-table-body{width:220px;height:104px;flex:none;margin:0 8px;display:flex;align-items:center;justify-content:center;color:transparent;background:url(../chartster/icons/table.png) center/contain no-repeat;position:relative;filter:drop-shadow(0 4px 24px rgba(143,95,255,.5))}
.ts-side{display:flex;align-items:center;justify-content:center;padding:4px 0;flex:1}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px;cursor:pointer}
.seat-inp{width:92px;background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:6px 8px;color:var(--text);font-family:'Outfit',sans-serif;font-size:12px;outline:none;display:none;text-align:center}
.seat.active .seat-inp{display:block}
.ts-side .seat-inp{width:72px}
.seat-circle{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(83,246,255,.3);display:flex;align-items:center;justify-content:center;transition:all .25s;background:rgba(83,246,255,.04);position:relative;overflow:hidden;color:rgba(83,246,255,.4);box-shadow:0 0 8px rgba(83,246,255,.08)}
.seat.active .seat-circle{border-style:solid;border-width:2.5px;color:#07000f}
.seat.active .seat-circle::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.18),transparent 70%)}

/* ── GAME LAYOUT WITH POSITIONED BUZZERS ── */
#buzz-arena{
  position:relative;
  width:100%;
  max-width:960px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    ". top ."
    "left img right"
    ". bot .";
  gap:0;
  align-items:center;
  justify-items:center;
}
.buzz-row{display:flex;gap:8px;width:100%;justify-content:space-between;padding:0 4px;}
.buzz-row.top{grid-area:top;align-self:end;padding-bottom:6px;}
.buzz-row.top .team-buzz-wrap{flex-direction:column-reverse;} /* buzzer top, name toward image */

.buzz-row.bot{grid-area:bot;align-self:start;padding-top:6px;}
.team-buzz-wrap{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .1s;
}
.team-buzz-wrap:active{transform:scale(.93)!important}
/* Left col: buzzer at screen edge, name between buzzer and image (row-reverse) */
#buzz-col-left .team-buzz-wrap{flex-direction:row-reverse;gap:10px;align-items:center;}
/* Right col: name between image and buzzer (row) */
#buzz-col-right .team-buzz-wrap{flex-direction:row;gap:10px;align-items:center;}
.team-buzz-wrap.buzzed-out{opacity:.25;pointer-events:none}
.team-buzz-3d{
  width:clamp(64px,12vw,90px);
  height:clamp(64px,12vw,90px);
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}
/* outer metal ring */
.tbz-outer{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#888 0%,#333 40%,#111 100%);
  box-shadow:0 4px 16px rgba(0,0,0,.7),inset 0 2px 3px rgba(255,255,255,.12),inset 0 -2px 4px rgba(0,0,0,.5);
}
/* colored dome */
.tbz-dome{
  position:absolute;inset:10%;border-radius:50%;
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),inset 0 3px 7px rgba(255,255,255,.2),0 3px 12px var(--tcol);
  transition:box-shadow .3s;
}
.game-active .tbz-dome{
  animation:dome-pulse 1.8s ease-in-out infinite;
}
@keyframes dome-pulse{
  0%,100%{box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),inset 0 3px 7px rgba(255,255,255,.2),0 3px 12px var(--tcol),0 0 20px var(--tcol);}
  50%{box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),inset 0 3px 7px rgba(255,255,255,.2),0 3px 24px var(--tcol),0 0 40px var(--tcol);}
}
/* shine */
.tbz-shine{
  position:absolute;top:13%;left:20%;width:28%;height:18%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0%,transparent 70%);
  pointer-events:none;
}
/* pulse ring */
.team-buzz-wrap::before{
  content:'';
  width:clamp(64px,12vw,90px);
  height:clamp(64px,12vw,90px);
  border-radius:50%;
  background:radial-gradient(circle,var(--tcol,#fff) 0%,transparent 70%);
  opacity:.25;
  animation:buzzer-pulse 1.4s ease-in-out infinite;
  position:absolute;
  pointer-events:none;
}
.team-buzz-name{
  font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tcol);
  text-shadow:0 0 8px var(--tcol);
}
/* top row buzzers flip upside-down */


/* version */
.ver{position:fixed;bottom:12px;right:16px;font-size:11px;font-weight:700;color:rgba(255,255,255,.3);z-index:100}
</style>
</head>
<body>

<div id="hint-toast"></div>
<div id="confetti"></div>
<div id="victoryOverlay"></div>
<div class="ver">v2.0</div>

<!-- ════ LOBBY ════ -->
<div id="screen-lobby" class="screen active">
<div class="card">
  <div class="game-title">PAPARAZZI</div>
  <div style="font-size:13px;color:var(--muted);margin-top:-8px">Erkenne den Künstler aus dem verschwommenen Bild</div>
  <div class="sep"></div>

  
  <div id="table-selector">
    <div class="ts-top-row">
      <div class="seat" data-pos="top-l" onclick="toggleSeat('top-l')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
      <div class="seat" data-pos="top-r" onclick="toggleSeat('top-r')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
    </div>
    <div class="ts-mid-row">
      <div class="ts-side"><div class="seat" data-pos="left" onclick="toggleSeat('left')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()"></div></div>
      <div id="ts-table-body"></div>
      <div class="ts-side"><div class="seat" data-pos="right" onclick="toggleSeat('right')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Team" onclick="event.stopPropagation()"></div></div>
    </div>
    <div class="ts-bot-row">
      <div class="seat" data-pos="bot-l" onclick="toggleSeat('bot-l')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
      <div class="seat" data-pos="bot-r" onclick="toggleSeat('bot-r')"><div class="seat-circle"><svg width="24" height="24" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="5" fill="currentColor"/><path d="M3 23c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><input class="seat-inp" placeholder="Teamname" onclick="event.stopPropagation()"></div>
    </div>
  </div>

  <div class="sep"></div>
  <div class="label">🏆 Gewinnpunkte</div>
  <div class="goal-sel">
    <button class="goal-btn" data-g="3" onclick="setGoal(this)"><span class="gn">3</span><span class="gl">Punkte</span></button>
    <button class="goal-btn on" data-g="5" onclick="setGoal(this)"><span class="gn">5</span><span class="gl">Punkte</span></button>
    <button class="goal-btn" data-g="7" onclick="setGoal(this)"><span class="gn">7</span><span class="gl">Punkte</span></button>
  </div>

  <div class="sep"></div>
  <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>Spiel starten</button>
  <div id="lobby-status" style="font-size:13px;color:var(--muted);text-align:center;min-height:18px"></div>
</div>
</div>

<!-- ════ GAME ════ -->
<div id="screen-game" class="screen">
  <div class="scoreboard" id="scoreboard"></div>

  <div id="buzz-arena">
    <!-- TOP buzzers -->
    <div class="buzz-row top" id="buzz-row-top"></div>

    <!-- LEFT buzzers -->
    <div id="buzz-col-left" style="grid-area:left;display:flex;flex-direction:column;gap:8px;padding-right:0px"></div>

    <!-- CENTER: image only, all UI inside rotating wrapper -->
    <div style="grid-area:img;width:100%">
      <div class="reveal-wrap" id="reveal-wrap">
        <canvas id="reveal-canvas" style="display:none"></canvas>
        <div id="img-rotate-wrap" style="position:absolute;inset:0;transform-origin:center center;transition:transform 0.6s ease">
          <!-- artist img inserted here dynamically -->
          <div class="reveal-progress"><div class="reveal-progress-bar" id="progress-bar"></div></div>
          <div id="bottom-panel">
            <!-- State 1: waiting for Start (rotates with image) -->
            <div id="bp-waiting">
              <button class="bp-start" onclick="startReveal()">Start</button>
            </div>
            <!-- State 2: buzzed – team name BUZZZEERR + Zur Auflösung -->
            <div id="bp-buzzed">
              <div id="bp-buzz-name" class="bp-team"></div>
              <button class="bp-action" onclick="revealNow()">Zur Auflösung</button>
            </div>
            <!-- State 3: judging – artist name + Richtig / Falsch -->
            <div id="bp-judging">
              <div id="bp-artist" class="bp-artist"></div>
              <div class="bp-row">
                <button class="bp-btn bp-correct" onclick="judge(true)">Richtig</button>
                <button class="bp-btn bp-wrong"   onclick="judge(false)">Falsch</button>
              </div>
            </div>
            <!-- State 4: timeout – artist name + Weiter -->
            <div id="bp-timeout">
              <div id="bp-to-artist" class="bp-artist"></div>
              <button class="bp-next" onclick="nextArtist()">Weiter</button>
            </div>
          </div>
        </div>
        <!-- Start overlay: bottom-anchored, does NOT rotate with image -->
        <div id="bp-start-overlay" style="position:absolute;left:0;right:0;bottom:0;top:auto;display:none;flex-direction:column;align-items:center;justify-content:flex-end;z-index:25;padding:56px 18px 16px;background:linear-gradient(to bottom,transparent 0%,rgba(7,0,15,.75) 28%,rgba(7,0,15,.94) 55%)">
          <button class="bp-start" onclick="startReveal()">Start</button>
        </div>
      </div>
    </div>

    <!-- RIGHT buzzers -->
    <div id="buzz-col-right" style="grid-area:right;display:flex;flex-direction:column;gap:8px;padding-left:0px"></div>

    <!-- BOTTOM buzzers -->
    <div class="buzz-row bot" id="buzz-row-bot"></div>
  </div>
</div>

<script>
// ════ AUDIO ════

// ════ COLORS + SEAT CONFIG ════
var COLORS=['#53f6ff','#ff4fd8','#8f5fff','#4dff91','#ff9f1c','#e0ff4f'];
var DEFAULTS=['Helden','Legenden','Stars','Cracks','Profis','Champs'];
var MAX_TEAMS=6;
var SEAT_POS=['top-l','top-r','left','right','bot-l','bot-r'];
var SEAT_SIDE={
  'top-l':'top','top-r':'top',
  'left':'left','right':'right',
  'bot-l':'bot','bot-r':'bot'
};
// seatCfg: pos → {name, colorIdx} | null
var seatCfg={'top-l':null,'top-r':null,'left':null,'right':null,'bot-l':null,'bot-r':null};

function toggleSeat(pos){
  var seat=document.querySelector('.seat[data-pos="'+pos+'"]');
  if(seatCfg[pos]){
    seatCfg[pos]=null;seat.classList.remove('active');
    seat.querySelector('.seat-circle').style.cssText='';
    var inp=seat.querySelector('.seat-inp');inp.value='';inp.style.display='none';
    reassignSeatColors();
  } else {
    var active=getActiveSeats();
    if(active.length>=MAX_TEAMS){showHint('Maximal '+MAX_TEAMS+' Teams!');return;}
    var ci=active.length;
    seatCfg[pos]={name:'',colorIdx:ci};
    seat.classList.add('active');
    var circ=seat.querySelector('.seat-circle');
    circ.style.background=COLORS[ci];circ.style.borderColor=COLORS[ci];
    circ.style.borderStyle='solid';circ.textContent=DEFAULTS[ci].substring(0,2);
    var inp=seat.querySelector('.seat-inp');
    inp.style.display='block';inp.placeholder=DEFAULTS[ci];
  }
  updateStartBtn();
}
function reassignSeatColors(){
  getActiveSeats().forEach(function(pos,i){
    var seat=document.querySelector('.seat[data-pos="'+pos+'"]');
    seatCfg[pos].colorIdx=i;
    var circ=seat.querySelector('.seat-circle');
    circ.style.background=COLORS[i];circ.style.borderColor=COLORS[i];
    seat.querySelector('.seat-inp').placeholder=DEFAULTS[i];
  });
}
function getActiveSeats(){return SEAT_POS.filter(function(p){return seatCfg[p]!==null;});}
function updateStartBtn(){
  var ok=getActiveSeats().length>=2;
  document.getElementById('start-btn').disabled=!ok;
}

// ════ PIXELATION STEPS ════
// 8 steps: block size from very large → 1 (full res)
var BLUR_STEPS=[20,16,13,10,8,6,1,0];
var STEP_INTERVAL=1600; // ms per step

// ════ STATE ════
var G={
  artists:[],   // filtered artist pool [{name,img,followers}]
  goal:5,
  players:[],
  scores:[],
  // per-round
  queue:[],     // shuffled artist indices remaining
  cur:null,     // current artist object
  img:null,     // loaded Image
  stepIdx:0,
  stepTimer:null,
  buzzedPlayer:-1,  // who buzzed (-1 = none)
  buzzedOut:[],     // players out this round (wrong buzz)
  running:false,
  startSeatIdx:0,   // clockwise rotation: which seat starts next round
  imgRotateDeg:0,
  imgRotateScale:1
};

// Clockwise seat order
var CW_ORDER=['top-l','top-r','right','bot-r','bot-l','left'];

// ════ BOOT ════
loadSongs();

function loadSongs(){
  document.getElementById('lobby-status').textContent='lädt …';
  fetch('../chartster/songs.json')
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(function(data){
      var all=Array.isArray(data)?data:(data.songs||[]);
      // Build artist pool: top20 of any year + sort by followers top50
      var artistMap={};
      all.forEach(function(s){
        var key=(s.a||'').trim().toLowerCase();
        if(!key) return;
        var inTop20=(s.p&&s.p<=20);
        var hasImg=!!(s.ca&&s.ca.trim());
        var imgUrl=hasImg?s.ca.trim():null;
        if(!artistMap[key]){
          artistMap[key]={
            name:(s.a||'').trim(),
            img:hasImg?imgUrl:null,
            followers:s.fo||0,
            inTop20:inTop20
          };
        } else {
          if(hasImg && !artistMap[key].img) artistMap[key].img=imgUrl;
          if((s.fo||0)>artistMap[key].followers) artistMap[key].followers=s.fo||0;
          if(inTop20) artistMap[key].inTop20=true;
        }
      });
      // Nur Künstler MIT Bild UND mindestens einmal in Top 20
      var pool=Object.values(artistMap).filter(function(a){ return !!a.img && a.inTop20; });
      G.artists=shuffle(pool);

      if(G.artists.length===0){
        document.getElementById('lobby-status').textContent=
          '⚠ Keine Künstlerbilder in songs.json — bitte spotify_link_fetcher.py ausführen';
        return;
      }
      document.getElementById('lobby-status').textContent=
        G.artists.length+' Künstler verfügbar';
      updateStartBtn();
    })
    .catch(function(){
      document.getElementById('lobby-status').textContent='⚠ songs.json nicht gefunden';
    });
}

// ════ GOAL ════
function setGoal(btn){
  document.querySelectorAll('.goal-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  G.goal=parseInt(btn.dataset.g);
}

// ════ START ════
function startGame(){
  var active=getActiveSeats();
  if(active.length<2){showHint('Mindestens 2 Teams!');return;}
  if(G.artists.length===0){showHint('Songs noch nicht geladen – kurz warten!');return;}

  G.teams=active.map(function(pos,i){
    var inp=document.querySelector('.seat[data-pos="'+pos+'"] .seat-inp');
    var name=inp&&inp.value.trim()?inp.value.trim():DEFAULTS[i];
    return{name:name,color:COLORS[i],pos:pos,side:SEAT_SIDE[pos]};
  });
  G.players=G.teams.map(function(t){return t.name;});
  G.scores=G.teams.map(function(){return 0;});
  G.queue=shuffle(G.artists.map(function(_,i){return i;}));

  G.startSeatIdx=0;
  renderScoreboard();
  renderBuzzArena();
  rotateImageToTeam();
  document.getElementById('screen-game').classList.add('game-active');
  showScreen('game');
  nextArtist();
}

// ════ SCOREBOARD ════
function renderScoreboard(){
  var sb=document.getElementById('scoreboard');
  sb.innerHTML='';
  G.players.forEach(function(name,i){
    var chip=document.createElement('div');
    chip.className='s-chip';
    chip.id='chip-'+i;
    // goal pips
    var pips='';
    for(var p=0;p<G.goal;p++){
      pips+='<div class="goal-pip'+(p<G.scores[i]?' filled':'')+'" id="pip-'+i+'-'+p+'"></div>';
    }
    chip.innerHTML=
      '<div class="sdot" style="background:'+COLORS[i]+';box-shadow:0 0 6px '+COLORS[i]+'"></div>'+
      '<span>'+esc(name)+'</span>'+
      '<span class="spts" id="pts-'+i+'" style="color:'+COLORS[i]+'">'+G.scores[i]+'</span>'+
      '<div class="goal-bar" id="bar-'+i+'">'+pips+'</div>';
    sb.appendChild(chip);
  });
}
function updateScoreboard(){
  G.players.forEach(function(_,i){
    var pts=Math.max(0,G.scores[i]);
    document.getElementById('pts-'+i).textContent=G.scores[i];
    for(var p=0;p<G.goal;p++){
      var pip=document.getElementById('pip-'+i+'-'+p);
      if(pip) pip.className='goal-pip'+(p<pts?' filled':'');
    }
  });
}

// ════ NEXT ARTIST ════
function showPanel(state){
  ['bp-waiting','bp-buzzed','bp-judging','bp-timeout'].forEach(function(id){
    document.getElementById(id).classList.toggle('on', id==='bp-'+state);
  });
  document.getElementById('bottom-panel').classList.toggle('show', !!state);
}

function nextArtist(){
  showPanel(null);
  // Re-enable all buzz buttons
  document.querySelectorAll('.team-buzz-wrap').forEach(function(b){
    b.classList.remove('buzzed-out');
    b.style.pointerEvents='';b.style.opacity='1';b.style.transform='';
    var dome=b.querySelector('.tbz-dome');if(dome)dome.style.boxShadow='';
  });

  if(G.queue.length===0) G.queue=shuffle(G.artists.map(function(_,i){return i;}));
  var idx=G.queue.pop();
  G.cur=G.artists[idx];
  G.stepIdx=0;
  G.buzzedPlayer=-1;
  G.buzzedOut=[];
  G.running=false;
  // Rotate clockwise
  G.startSeatIdx=(G.startSeatIdx+1)%Math.max(1,G.teams.length);
  renderBuzzArena();
  rotateImageToTeam();

  // Reset progress
  document.getElementById('progress-bar').style.width='0%';

  // Load image at max blur, then show Start button
  var rotWrap=document.getElementById('img-rotate-wrap');
  if(revealImg){ revealImg.remove(); revealImg=null; }
  var img=document.createElement('img');
  img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter 0.6s ease;border-radius:18px;';
  img.style.filter='blur('+BLUR_STEPS[0]+'px)';
  img.onload=function(){
    revealImg=img;
    drawStep(0);
    showPanel('waiting');
  };
  img.onerror=function(){ nextArtist(); };
  img.src=G.cur.img;
  rotWrap.insertBefore(img, rotWrap.firstChild);
}

function startReveal(){
  showPanel(null);
  G.running=true;
  scheduleNext();
}

// ════ BLUR REVEAL ════
// Uses an <img> with CSS filter:blur() instead of canvas pixelation
var revealImg = null;

function drawStep(stepIdx){
  var steps = BLUR_STEPS;
  var blur = steps[Math.min(stepIdx, steps.length-1)];
  if(revealImg){
    revealImg.style.filter = blur > 0 ? 'blur('+blur+'px)' : 'none';
    // transform is managed by img-rotate-wrap
  }
}

function scheduleNext(){
  clearTimeout(G.stepTimer);
  if(!G.running) return;
  G.stepTimer=setTimeout(function(){
    if(!G.running) return;
    G.stepIdx++;
    if(G.stepIdx>=BLUR_STEPS.length){
      // fully revealed — show solution without result badge
      G.running=false;
      showSolution('timeout');
      return;
    }
    drawStep(G.stepIdx);
    var pct=Math.round((G.stepIdx/(BLUR_STEPS.length-1))*100);
    document.getElementById('progress-bar').style.width=pct+'%';
    scheduleNext();
  },STEP_INTERVAL);
}

// ════ BUZZ ARENA ════
// Color helpers for dome gradient
function hexToRgb(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return[r,g,b];}
function lighten(hex){try{var c=hexToRgb(hex);return'rgb('+Math.min(255,c[0]+80)+','+Math.min(255,c[1]+80)+','+Math.min(255,c[2]+80)+')';}catch(e){return hex;}}
function darken(hex){try{var c=hexToRgb(hex);return'rgb('+Math.max(0,c[0]-80)+','+Math.max(0,c[1]-80)+','+Math.max(0,c[2]-80)+')';}catch(e){return hex;}}

function rotateImageToTeam(){
  // Determine which side the current start team is on
  var cwTeams=[];
  CW_ORDER.forEach(function(pos){
    G.teams.forEach(function(t,i){if(t.pos===pos) cwTeams.push({team:t,idx:i});});
  });
  if(!cwTeams.length) return;
  var shift=G.startSeatIdx % cwTeams.length;
  var activeCWPos=[];
  CW_ORDER.forEach(function(pos){
    if(G.teams.some(function(t){return t.pos===pos;})) activeCWPos.push(pos);
  });
  var rotatedPos=activeCWPos.slice();
  for(var r=0;r<shift;r++) rotatedPos.push(rotatedPos.shift());
  var vSide=SEAT_SIDE[rotatedPos[0]]||'bot';
  // Map side to degrees: bot=0 (normal), left=90, top=180, right=270
  var degMap={bot:0,left:90,top:180,right:270};
  var deg=degMap[vSide]||0;
  // Rotate the img element inside reveal-wrap
  // For 90/270: also scale down to fit inside square container
  var scale=(deg===90||deg===270)?0.88:1;
  // Rotate the shared wrapper (img + solution panel) together
  var rotWrap=document.getElementById('img-rotate-wrap');
  if(rotWrap){
    rotWrap.style.transition='transform 0.6s ease';
    rotWrap.style.transform='rotate('+deg+'deg) scale('+scale+')';
  }
  // Store current rotation for drawStep
  G.imgRotateDeg=deg;
  G.imgRotateScale=scale;
}

function renderBuzzArena(){
  // Place buzzers at their ACTUAL chosen seat positions
  // Clockwise rotation only shifts which team goes where visually
  var cwTeams=[];
  CW_ORDER.forEach(function(pos){
    G.teams.forEach(function(t,i){if(t.pos===pos) cwTeams.push({team:t,idx:i});});
  });
  var shift=G.startSeatIdx % Math.max(1,cwTeams.length);
  // Rotate the team list, but keep using the original position slots
  var rotated=cwTeams.slice();
  for(var r=0;r<shift;r++) rotated.push(rotated.shift());

  // Get the list of active positions in CW order
  var activeCWPos=[];
  CW_ORDER.forEach(function(pos){
    if(G.teams.some(function(t){return t.pos===pos;})) activeCWPos.push(pos);
  });

  // Assign each rotated team to the next position in CW order
  var visualRows={top:[],bot:[],left:[],right:[]};
  rotated.forEach(function(x,i){
    var assignedPos=activeCWPos[i];
    var vSide=SEAT_SIDE[assignedPos]||'bot';
    visualRows[vSide].push({team:x.team,idx:x.idx,side:vSide});
  });

  function buzzerHTML(t,i,side){
    var nameRot='';
    if(side==='top')   nameRot='transform:rotate(180deg)';
    if(side==='left')  nameRot='transform:rotate(90deg)';
    if(side==='right') nameRot='transform:rotate(270deg)';
    return '<div class="team-buzz-wrap" id="buzz-btn-'+i+'" '+
      'style="--tcol:'+t.color+';position:relative" '+
      'onclick="onBuzz('+i+')" ontouchstart="event.preventDefault();onBuzz('+i+')">'+
      '<div class="team-buzz-name" style="'+nameRot+'">'+esc(t.name)+'</div>'+
      '<div class="team-buzz-3d">'+
        '<div class="tbz-outer"></div>'+
        '<div class="tbz-dome" style="background:radial-gradient(circle at 38% 28%,'+lighten(t.color)+' 0%,'+t.color+' 40%,'+darken(t.color)+' 100%)"></div>'+
        '<div class="tbz-shine"></div>'+
      '</div>'+
    '</div>';
  }

  document.getElementById('buzz-row-top').innerHTML=visualRows.top.map(function(x){return buzzerHTML(x.team,x.idx,'top');}).join('');
  document.getElementById('buzz-row-bot').innerHTML=visualRows.bot.map(function(x){return buzzerHTML(x.team,x.idx,'bot');}).join('');
  document.getElementById('buzz-col-left').innerHTML=visualRows.left.map(function(x){return buzzerHTML(x.team,x.idx,'left');}).join('');
  document.getElementById('buzz-col-right').innerHTML=visualRows.right.map(function(x){return buzzerHTML(x.team,x.idx,'right');}).join('');
}


function onBuzz(playerIdx){
  if(!G.running) return;
  if(G.buzzedOut.includes(playerIdx)) return;
  clearTimeout(G.stepTimer);
  G.running=false;
  G.buzzedPlayer=playerIdx;
  // Dim all buttons, highlight buzzer
  document.querySelectorAll('.team-buzz-wrap').forEach(function(b){b.style.pointerEvents='none';b.style.opacity='.25';});
  var bb=document.getElementById('buzz-btn-'+playerIdx);
  if(bb){bb.style.opacity='1';bb.style.transform='scale(1.15)';bb.querySelector('.tbz-dome').style.boxShadow='0 0 30px 8px '+G.teams[playerIdx].color;}
  // Show buzzed panel
  document.getElementById('bp-buzz-name').innerHTML=
    '<span style="color:'+G.teams[playerIdx].color+'">'+esc(G.teams[playerIdx].name)+'</span>'+
    '<span style="color:rgba(240,240,255,.9)"> BUZZZEERR</span>';
  showPanel('buzzed');
}

function revealNow(){
  // Fully reveal image
  drawStep(BLUR_STEPS.length-1);
  document.getElementById('progress-bar').style.width='100%';
  // Show artist name + Richtig/Falsch
  document.getElementById('bp-artist').textContent=G.cur.name;
  showPanel('judging');
}

function judge(correct){
  var pi=G.buzzedPlayer;
  if(correct){
    G.scores[pi]++;
    updateScoreboard();
    spawnConfetti(G.teams[pi].color,50);
    if(G.scores[pi]>=G.goal){ showPanel(null); setTimeout(showVictory,600); return; }
  } else {
    G.scores[pi]=Math.max(-99,G.scores[pi]-1);
    updateScoreboard();
  }
  // Next artist after short pause
  setTimeout(nextArtist, 800);
  showPanel(null);
}

function showSolution(type){
  // Timeout: image fully revealed, nobody buzzed
  G.running=false;
  clearTimeout(G.stepTimer);
  drawStep(BLUR_STEPS.length-1);
  document.getElementById('progress-bar').style.width='100%';
  document.querySelectorAll('.team-buzz-wrap').forEach(function(b){b.style.pointerEvents='none';b.style.opacity='.25';});
  document.getElementById('bp-to-artist').textContent=G.cur.name;
  showPanel('timeout');
}

// ════ VICTORY ════
function showVictory(){
  var ranked=G.players
    .map(function(name,i){return{name:name,score:G.scores[i],color:COLORS[i]};})
    .sort(function(a,b){return b.score-a.score;});
  var medals=['🥇','🥈','🥉','🏅','5.','6.'];

  var rows=ranked.map(function(p,i){
    var win=i===0;
    return '<div class="vc-row'+(win?' winner':'')+'">'+
      '<span class="vc-medal">'+medals[i]+'</span>'+
      '<span class="vc-name">'+esc(p.name)+'</span>'+
      '<span class="vc-pts" style="color:'+(win?'gold':p.color)+'">'+
        p.score+'<small> Pt'+(p.score!==1?'s':'')+'</small></span></div>';
  }).join('');

  document.getElementById('victoryOverlay').innerHTML=
    '<div class="vc-inner">'+
    '<div class="vc-title">🏆 '+esc(ranked[0].name)+' gewinnt!</div>'+
    '<div class="vc-scores">'+rows+'</div>'+
    '<button class="vfinal-btn" onclick="resetToLobby()">🔄 Nochmal spielen</button>'+
    '</div>';
  document.getElementById('victoryOverlay').classList.add('show');
  spawnConfetti(COLORS[0],140);
}

function resetToLobby(){
  clearTimeout(G.stepTimer);
  G.running=false;
  document.getElementById('victoryOverlay').classList.remove('show');
  document.getElementById('screen-game').classList.remove('game-active');
  showScreen('lobby');
}

// ════ UTILS ════
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  var el=document.getElementById('screen-'+name);if(el)el.classList.add('active');
}
function showHint(msg){
  var el=document.getElementById('hint-toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},3000);
}
function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatFollowers(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+' Mio.';
  if(n>=1000) return (n/1000).toFixed(0)+' Tsd.';
  return n+'';
}
function spawnConfetti(color,count){
  var c=document.getElementById('confetti');
  var cols=[color,'#fff','#ffd84d',COLORS[Math.floor(Math.random()*COLORS.length)]];
  for(var i=0;i<count;i++){
    var p=document.createElement('div');
    var sz=5+Math.random()*12;var dur=1.2+Math.random()*1.8;
    p.style.cssText='position:absolute;top:-20px;left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';border-radius:'+['50%','3px','0'][i%3]+';transform:rotate('+Math.random()*360+'deg);animation:cf-fall '+dur+'s '+Math.random()*.6+'s linear both';
    c.appendChild(p);
    setTimeout(function(el){el.remove();},(dur+1)*1000,p);
  }
}
</script>
</body>
