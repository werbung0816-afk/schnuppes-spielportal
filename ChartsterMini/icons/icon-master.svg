<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0535"/>
      <stop offset="100%" stop-color="#07000f"/>
    </radialGradient>

    <!-- Bar gradients -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#53f6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a8899" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b060ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4a0080" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a0060" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Note gradient -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6ee8"/>
      <stop offset="100%" stop-color="#ff0090"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Reflection gradient -->
    <linearGradient id="reflGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#53f6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#53f6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflPurp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b060ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b060ff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="roundedRect">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedRect)">

    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Ambient glow spots -->
    <ellipse cx="256" cy="380" rx="200" ry="60" fill="#8f5fff" opacity="0.15"/>
    <ellipse cx="130" cy="420" rx="100" ry="35" fill="#53f6ff" opacity="0.12"/>
    <ellipse cx="380" cy="420" rx="100" ry="35" fill="#ff4fd8" opacity="0.12"/>

    <!-- Floor line -->
    <rect x="40" y="418" width="432" height="2" rx="1" fill="rgba(255,255,255,0.08)"/>

    <!-- ── BARS ── -->
    <!-- Bar 1 (far left, cyan, short) -->
    <rect x="44" y="300" width="72" height="118" rx="10" fill="url(#barCyan)" filter="url(#glowCyan)"/>
    <rect x="44" y="300" width="72" height="118" rx="10" fill="none" stroke="#53f6ff" stroke-width="1.5" opacity="0.8"/>
    <!-- dot grid texture -->
    <g opacity="0.35" fill="#53f6ff">
      <rect x="58" y="315" width="5" height="5" rx="1"/><rect x="70" y="315" width="5" height="5" rx="1"/><rect x="82" y="315" width="5" height="5" rx="1"/><rect x="94" y="315" width="5" height="5" rx="1"/>
      <rect x="58" y="328" width="5" height="5" rx="1"/><rect x="70" y="328" width="5" height="5" rx="1"/><rect x="82" y="328" width="5" height="5" rx="1"/><rect x="94" y="328" width="5" height="5" rx="1"/>
      <rect x="58" y="341" width="5" height="5" rx="1"/><rect x="70" y="341" width="5" height="5" rx="1"/><rect x="82" y="341" width="5" height="5" rx="1"/><rect x="94" y="341" width="5" height="5" rx="1"/>
      <rect x="58" y="354" width="5" height="5" rx="1"/><rect x="70" y="354" width="5" height="5" rx="1"/><rect x="82" y="354" width="5" height="5" rx="1"/><rect x="94" y="354" width="5" height="5" rx="1"/>
      <rect x="58" y="367" width="5" height="5" rx="1"/><rect x="70" y="367" width="5" height="5" rx="1"/><rect x="82" y="367" width="5" height="5" rx="1"/><rect x="94" y="367" width="5" height="5" rx="1"/>
      <rect x="58" y="380" width="5" height="5" rx="1"/><rect x="70" y="380" width="5" height="5" rx="1"/><rect x="82" y="380" width="5" height="5" rx="1"/><rect x="94" y="380" width="5" height="5" rx="1"/>
      <rect x="58" y="393" width="5" height="5" rx="1"/><rect x="70" y="393" width="5" height="5" rx="1"/><rect x="82" y="393" width="5" height="5" rx="1"/><rect x="94" y="393" width="5" height="5" rx="1"/>
    </g>
    <!-- reflection -->
    <rect x="44" y="420" width="72" height="40" rx="0" fill="url(#reflGrad)" transform="scale(1,-1) translate(0,-880)" opacity="0.4"/>

    <!-- Bar 2 (left-center, purple, medium) -->
    <rect x="136" y="230" width="72" height="188" rx="10" fill="url(#barPurple)" filter="url(#glowPurple)"/>
    <rect x="136" y="230" width="72" height="188" rx="10" fill="none" stroke="#b060ff" stroke-width="1.5" opacity="0.8"/>
    <g opacity="0.3" fill="#b060ff">
      <rect x="150" y="245" width="5" height="5" rx="1"/><rect x="162" y="245" width="5" height="5" rx="1"/><rect x="174" y="245" width="5" height="5" rx="1"/><rect x="186" y="245" width="5" height="5" rx="1"/>
      <rect x="150" y="258" width="5" height="5" rx="1"/><rect x="162" y="258" width="5" height="5" rx="1"/><rect x="174" y="258" width="5" height="5" rx="1"/><rect x="186" y="258" width="5" height="5" rx="1"/>
      <rect x="150" y="271" width="5" height="5" rx="1"/><rect x="162" y="271" width="5" height="5" rx="1"/><rect x="174" y="271" width="5" height="5" rx="1"/><rect x="186" y="271" width="5" height="5" rx="1"/>
      <rect x="150" y="284" width="5" height="5" rx="1"/><rect x="162" y="284" width="5" height="5" rx="1"/><rect x="174" y="284" width="5" height="5" rx="1"/><rect x="186" y="284" width="5" height="5" rx="1"/>
      <rect x="150" y="297" width="5" height="5" rx="1"/><rect x="162" y="297" width="5" height="5" rx="1"/><rect x="174" y="297" width="5" height="5" rx="1"/><rect x="186" y="297" width="5" height="5" rx="1"/>
      <rect x="150" y="310" width="5" height="5" rx="1"/><rect x="162" y="310" width="5" height="5" rx="1"/><rect x="174" y="310" width="5" height="5" rx="1"/><rect x="186" y="310" width="5" height="5" rx="1"/>
      <rect x="150" y="323" width="5" height="5" rx="1"/><rect x="162" y="323" width="5" height="5" rx="1"/><rect x="174" y="323" width="5" height="5" rx="1"/><rect x="186" y="323" width="5" height="5" rx="1"/>
      <rect x="150" y="336" width="5" height="5" rx="1"/><rect x="162" y="336" width="5" height="5" rx="1"/><rect x="174" y="336" width="5" height="5" rx="1"/><rect x="186" y="336" width="5" height="5" rx="1"/>
    </g>

    <!-- Bar 3 (center, pink/tallest) -->
    <rect x="220" y="150" width="72" height="268" rx="10" fill="url(#barPink)" filter="url(#glowPink)"/>
    <rect x="220" y="150" width="72" height="268" rx="10" fill="none" stroke="#ff4fd8" stroke-width="2" opacity="0.9"/>
    <g opacity="0.3" fill="#ff4fd8">
      <rect x="234" y="165" width="5" height="5" rx="1"/><rect x="246" y="165" width="5" height="5" rx="1"/><rect x="258" y="165" width="5" height="5" rx="1"/><rect x="270" y="165" width="5" height="5" rx="1"/>
      <rect x="234" y="178" width="5" height="5" rx="1"/><rect x="246" y="178" width="5" height="5" rx="1"/><rect x="258" y="178" width="5" height="5" rx="1"/><rect x="270" y="178" width="5" height="5" rx="1"/>
      <rect x="234" y="191" width="5" height="5" rx="1"/><rect x="246" y="191" width="5" height="5" rx="1"/><rect x="258" y="191" width="5" height="5" rx="1"/><rect x="270" y="191" width="5" height="5" rx="1"/>
      <rect x="234" y="204" width="5" height="5" rx="1"/><rect x="246" y="204" width="5" height="5" rx="1"/><rect x="258" y="204" width="5" height="5" rx="1"/><rect x="270" y="204" width="5" height="5" rx="1"/>
    </g>

    <!-- Bar 4 (right-center, cyan) -->
    <rect x="304" y="250" width="72" height="168" rx="10" fill="url(#barCyan)" filter="url(#glowCyan)"/>
    <rect x="304" y="250" width="72" height="168" rx="10" fill="none" stroke="#53f6ff" stroke-width="1.5" opacity="0.8"/>
    <g opacity="0.3" fill="#53f6ff">
      <rect x="318" y="265" width="5" height="5" rx="1"/><rect x="330" y="265" width="5" height="5" rx="1"/><rect x="342" y="265" width="5" height="5" rx="1"/><rect x="354" y="265" width="5" height="5" rx="1"/>
      <rect x="318" y="278" width="5" height="5" rx="1"/><rect x="330" y="278" width="5" height="5" rx="1"/><rect x="342" y="278" width="5" height="5" rx="1"/><rect x="354" y="278" width="5" height="5" rx="1"/>
      <rect x="318" y="291" width="5" height="5" rx="1"/><rect x="330" y="291" width="5" height="5" rx="1"/><rect x="342" y="291" width="5" height="5" rx="1"/><rect x="354" y="291" width="5" height="5" rx="1"/>
      <rect x="318" y="304" width="5" height="5" rx="1"/><rect x="330" y="304" width="5" height="5" rx="1"/><rect x="342" y="304" width="5" height="5" rx="1"/><rect x="354" y="304" width="5" height="5" rx="1"/>
      <rect x="318" y="317" width="5" height="5" rx="1"/><rect x="330" y="317" width="5" height="5" rx="1"/><rect x="342" y="317" width="5" height="5" rx="1"/><rect x="354" y="317" width="5" height="5" rx="1"/>
      <rect x="318" y="330" width="5" height="5" rx="1"/><rect x="330" y="330" width="5" height="5" rx="1"/><rect x="342" y="330" width="5" height="5" rx="1"/><rect x="354" y="330" width="5" height="5" rx="1"/>
    </g>

    <!-- Bar 5 (far right, purple, short) -->
    <rect x="396" y="310" width="72" height="108" rx="10" fill="url(#barPurple)" filter="url(#glowPurple)"/>
    <rect x="396" y="310" width="72" height="108" rx="10" fill="none" stroke="#b060ff" stroke-width="1.5" opacity="0.8"/>
    <g opacity="0.3" fill="#b060ff">
      <rect x="410" y="325" width="5" height="5" rx="1"/><rect x="422" y="325" width="5" height="5" rx="1"/><rect x="434" y="325" width="5" height="5" rx="1"/><rect x="446" y="325" width="5" height="5" rx="1"/>
      <rect x="410" y="338" width="5" height="5" rx="1"/><rect x="422" y="338" width="5" height="5" rx="1"/><rect x="434" y="338" width="5" height="5" rx="1"/><rect x="446" y="338" width="5" height="5" rx="1"/>
      <rect x="410" y="351" width="5" height="5" rx="1"/><rect x="422" y="351" width="5" height="5" rx="1"/><rect x="434" y="351" width="5" height="5" rx="1"/><rect x="446" y="351" width="5" height="5" rx="1"/>
      <rect x="410" y="364" width="5" height="5" rx="1"/><rect x="422" y="364" width="5" height="5" rx="1"/><rect x="434" y="364" width="5" height="5" rx="1"/><rect x="446" y="364" width="5" height="5" rx="1"/>
    </g>

    <!-- ── TREND LINE ── -->
    <polyline points="80,295 172,225 256,145 340,245 432,305"
      fill="none" stroke="url(#noteGrad)" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round"
      filter="url(#glowPink)" opacity="0.9"/>
    <!-- dots -->
    <circle cx="80"  cy="295" r="9" fill="#53f6ff" filter="url(#glowCyan)"/>
    <circle cx="172" cy="225" r="9" fill="#b060ff" filter="url(#glowPurple)"/>
    <circle cx="256" cy="145" r="11" fill="#ff4fd8" filter="url(#glowPink)"/>
    <circle cx="340" cy="245" r="9" fill="#53f6ff" filter="url(#glowCyan)"/>
    <circle cx="432" cy="305" r="9" fill="#b060ff" filter="url(#glowPurple)"/>

    <!-- ── CROWN (on top of center bar) ── -->
    <g transform="translate(256, 92)" filter="url(#glowPink)">
      <!-- Crown base -->
      <path d="M-44,38 L-44,8 L-22,-18 L0,8 L22,-18 L44,8 L44,38 Z"
        fill="none" stroke="#ff4fd8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Crown top dots -->
      <circle cx="-44" cy="8"  r="6" fill="#ff4fd8"/>
      <circle cx="0"   cy="-18" r="6" fill="#ff4fd8"/>
      <circle cx="44"  cy="8"  r="6" fill="#ff4fd8"/>
      <!-- Star inside crown -->
      <path d="M0,-4 L3,5 L12,5 L5,11 L8,20 L0,14 L-8,20 L-5,11 L-12,5 L-3,5 Z"
        fill="none" stroke="#ff4fd8" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- ── MUSIC NOTE (foreground) ── -->
    <g filter="url(#glowPink)">
      <!-- Note stem -->
      <rect x="268" y="248" width="14" height="110" rx="7" fill="url(#noteGrad)"/>
      <!-- Note head -->
      <ellipse cx="256" cy="362" rx="22" ry="16" fill="url(#noteGrad)" transform="rotate(-20,256,362)"/>
      <!-- Second note flag -->
      <rect x="268" y="278" width="14" height="80" rx="7" fill="url(#noteGrad)" transform="translate(30,0)"/>
      <ellipse cx="286" cy="362" rx="20" ry="14" fill="url(#noteGrad)" transform="rotate(-20,286,362) translate(32,0)"/>
      <!-- Beam connecting notes -->
      <rect x="268" y="248" width="56" height="13" rx="6" fill="url(#noteGrad)"/>
      <rect x="268" y="272" width="56" height="11" rx="5" fill="url(#noteGrad)" opacity="0.8"/>
    </g>

    <!-- ── FLOOR REFLECTION ── -->
    <rect x="44" y="420" width="72" height="36" rx="0" fill="#53f6ff" opacity="0.07"/>
    <rect x="136" y="420" width="72" height="30" rx="0" fill="#b060ff" opacity="0.07"/>
    <rect x="220" y="420" width="72" height="42" rx="0" fill="#ff4fd8" opacity="0.09"/>
    <rect x="304" y="420" width="72" height="28" rx="0" fill="#53f6ff" opacity="0.07"/>
    <rect x="396" y="420" width="72" height="24" rx="0" fill="#b060ff" opacity="0.07"/>

    <!-- ── BORDER GLOW ── -->
    <rect width="512" height="512" rx="110" fill="none"
      stroke="url(#barPurple)" stroke-width="3" opacity="0.5"/>

  </g>
</svg>
